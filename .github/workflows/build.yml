name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.2
        name: Jarvis Companion v1.7.2
        body: |
          JARVIS Companion v1.7.2 yangilanishi:
          - O'zbekcha ovozli media boshqaruvi: "Pauza", "Pauza qil", "To'xtat", "Davom ettir", "Qo'shiqni yop", "Videoni yop", "Musiqani o'chir", "Qo'shiqdan chiq" buyruqlari Gemini Live va mahalliy darajada 100% zudlik bilan ishlaydi.
          - 18+ va odobsiz videolar filtri: 18+, kattalar uchun va behayo videolar qat'iyan taqiqlanadi va bloklanadi.
          - O'zbekistonda taqiqlangan domlalar filtri va Fatvo.uz integratsiyasi: Oliy Sud taqiqlagan shaxslar videolari bloklangan, diniy savollarda faqat Hanafiy mazhabi va https://fatvo.uz/ rasmiy ma'lumotlariga tayaniladi.
          - ChatGPT uslubidagi yangi chat interfeysi: Matn yozilganda zamonaviy, silliq chat oynasi ochiladi va Markdown (qalin matn, kursiv, ro'yxatlar, kod bloklari) qo'llab-quvvatlanadi.
          - Ovozli muloqot paytida avtomatik tozalanish: Foydalanuvchi matn yozishni to'xtatib gapira boshlaganda yoki Jarvis gapirganda, chat oynasi silliq so'nib (fade-out) ekranni to'liq markaziy animatsion orbga bo'shatadi!
        files: app/build/outputs/apk/debug/app-debug.apk

