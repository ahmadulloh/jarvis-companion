name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.7
        name: Jarvis Companion v1.7.7
        body: |
          JARVIS Companion v1.7.7 — Kiber Globus va Jonli TV UI Mukammalligi (2, 3 va 4-rasmlar dizayni asosida):
          - 1-rasm kamchiliklari to'liq bartaraf etildi:
            • 3D Rangli Kiber Globus: Qora bo'shliq butunlay yo'q qilindi! Kosmik yulduzlar fonida ko'p rangli siyosiy mamlakatlar chegaralari, yashil-ko'k neon atmosfera halqasi va orbital aylanishi bilan 100% oflayn ishlaydigan Yer globusi (2 va 3-rasmlar bilan 1-ga-1 bir xil).
            • Sarlavha paneli tuzatildi: "J · A · R · V · I · S" yozuvi bir qatorda chiroyli joylashdi, "S" harfi pastga tushib ketishi to'xtatildi, ortiqcha menyu tugmasi olib tashlandi, o'ngda ⚙️ sozlamalar tugmasi va status bar safe area to'liq moslashtirildi.
            • "Kanallar" 2-ustunli ro'yxati: Qora bo'shliq o'rniga 10 ta o'zbek telekanali (Aqlvoy, BIZ Cinema, BIZ Music, BIZ TV, Bolajon, Cheksiz TV, Dasturxon TV, Dunyo bo'ylab, Farg'ona MTRK, Sport TV) O'zbekiston bayrog'i aylana nishonlari bilan 2 ustunda to'liq chiqadi.
            • "Jonli TV" kartasi: Yashil TV nishoni, "Jonli TV", "O'zbekiston kanallari", ● Online nishoni va O'zbekiston 24 16:9 tungi teleminora prevyusi hamda ((•)) Jonli efir indikatori.
          - 4-rasm (TV Tab & Jonli Efir):
            • 16:9 formatdagi jonli HLS video pleer, jonli boshqaruv (Pauza/Play, Ovoz slayderi, ● LIVE qizil yorug'lik, HD, To'liq ekran).
            • Kanal axborot banneri: Kanal nomi (Sport TV), "Jonli · O'zbekiston kanallari", ● LIVE va ⭐ Sevimlilar tugmasi.
            • Toifalar chipchalari: 📺 Barchasi, ⚽ Sport, 🎬 Kino, 📰 Yangiliklar, 👶 Bolalar, 🎵 Musiqa, 🌍 Dunyo (famelack.com integratsiyasi).
            • 2-ustunli brend logotipli kanallar kartalari: Sport TV, ITV HD, O'zbekiston 24, Zo'r TV, MTRK Sport, Sevimli TV, Milliy TV, Yoshlar TV.
          - Yagona pastki panel (Dock + Input Bar): 4 ta tab (Asosiy, TV, Musiqa, Chat) va 📎 Fayl biriktirish, Buyruq yozish, 🎙️ Mikrofon va ➤ Yuborish tugmalari hamisha mavjud.
          - 100% Oflayn va tezkor: Barcha teksturalar va ma'lumotlar APK ichida mujassam, internet zaif bo'lsa ham bir soniyada yuklanadi.
        files: app/build/outputs/apk/debug/app-debug.apk

