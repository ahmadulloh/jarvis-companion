name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.0
        name: Jarvis Companion v1.7.0
        body: |
          JARVIS Companion v1.7.0 yangilanishi:
          - Salomlashish ovozi (Welcome Greeting) to'liq haqiqiy Gemini Live ovoziga o'tkazildi (Charon, Puck, Kore, Fenrir, Aoede). Android tizimining sun'iy robotik ovozi butunlay to'xtatildi!
          - YouTube musiqa va videolarni to'g'ridan-to'g'ri ijro etish: qidiruv sahifasiga o'tib ketish xatosi bartaraf etildi, klip avtomatik tarzda ilova ichida darhol qo'yiladi.
          - Inline videopleyer uchun ekranda kattalashtirish (⛶ / 🗗) tugmasi qo'shildi: videoni 360dp balandlikda qulay tomosha qilish imkoni yaratildi.
          - Eskiz VPS serverdagi WebSocket ulanish parametrlarini tozalash va YouTube video ID ajratish kuchaytirildi.
        files: app/build/outputs/apk/debug/app-debug.apk

