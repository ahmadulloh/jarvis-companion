name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.4
        name: Jarvis Companion v1.7.4
        body: |
          JARVIS Companion v1.7.4 yangilanishi — JARVIS World Hologram TV & 3D Globus (Famelack & Global Live TV):
          - 3D Interaktiv Kiber Globus: Three.js orqali fazoda aylanuvchi 3D Yer shari, kiber HUD vizualizatsiyasi, neon atmosfera va davlatlar joylashuvi.
          - 173+ Davlat Jonli Telekanallari: O'zbekiston (BIZ TV, Sevimli TV, Zo'r TV, MY5, Aqlvoy, Bolajon, Dunyo bo'ylab, Futbol TV va 34 ta kanal), Turkiya, AQSH, Rossiya, Saudiya Arabistoni, BAA va butun jahon jonli efirlari.
          - HLS Kiber Pleer (hls.js): Jonli efir indikatori (● LIVE), to'liq ekran (Fullscreen), kichik oyna (Picture-in-Picture) va kanal almashtirish tugmalari.
          - Kategoriyalar va Filmlar: Famelack.com/tv/movies kabi to'liq Kinolar (Movies), Yangiliklar (News), Sport, Musiqa va Bolalar toifalari.
          - Tasodifiy Kanal (🎲 Lucky Dice): Tasodifiy tugma orqali globusni aylantirib, dunyoning istalgan davlatidan jonli telekanal ochish.
          - Ovozli Boshqaruv & Integratsiya: "BIZ TV ni qo'y", "Jonli telekanallarni och", "Turkiya kanallarini ko'rsat", "Kinolar telekanalini qo'y" buyruqlari Gemini Live va mahalliy darajada ishlaydi.
        files: app/build/outputs/apk/debug/app-debug.apk

