name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.8
        name: Jarvis Companion v1.7.8
        body: |
          JARVIS Companion v1.7.8 — 100% To'liq Ekran TV, Famelack Kiber Globus va Mukammal Qur'on AI:
          - TV Video To'liq Ekran (100% Fullscreen Immersive):
            • HTML5 requestFullscreen va WebChromeClient.onShowCustomView hamda Android.toggleFullscreen orqali video gorizontal (landscape) holatda telefon ekranini 100% to'liq egallaydi, qora bo'shliqlar butunlay yo'qotildi.
          - 3D Globusda Davlat Tanlash (famelack.com/tv/td uslubida):
            • Globus ustidagi davlat nishonlari (Chad, Saudiya Arabistoni, O'zbekiston, Turkiya, AQSH, Rossiya, BAA, Misr, Qozog'iston) bosilganda Famelack uslubidagi maxsus yon panel ochiladi.
            • Har bir davlatning poytaxti, mahalliy vaqti va jonli telekanallari ro'yxati chiqadi. Kanal bosilganda darhol jonli efir ishga tushadi.
          - UI Tozalandi va Siqilishlar Yo'qotildi:
            • Foydalanuvchi qat'iy talabiga ko'ra Chat bo'limi va pastki matn kiritish (input) paneli butunlay olib tashlandi.
            • Toza, erkin va nafis 4 ta tab: Asosiy, TV, Qur'on AI, Musiqa.
          - Qur'on AI Tubdan Soddalashtirildi va Poklandi:
            • Foydalanuvchi talabiga ko'ra ortiqcha tarjimalar va tafsirlar butunlay olib tashlandi.
            • Faqat sof Qur'on o'qish, Usmoniy xat, tajvid qoidalari va qorilar qiroati.
            • 10 ta qisqa suralar (Al-Fotiha, Al-Ixlos, Al-Falaq, An-Nos, Al-Kavsar, Al-Asr, An-Nasr, Al-Masad, Al-Kofirun, Oyatul Kursiy) ravon ochiladi, brauzerning xom alertlari yo'qotildi.
          - JARVIS Ovozli Yordamchisi Aralashuvi To'xtatildi:
            • Qur'on saboqlari ochilganda JARVIS fon ovozli tanib olishi avtomatik o'chiriladi, qiroat paytida foydalanuvchi ustiga gapirib yubormaydi.
            • 3-oyatdagi asossiz qizil xatolik olib tashlandi, har bir oyat toza va xolis tekshiriladi.
        files: app/build/outputs/apk/debug/app-debug.apk

