name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.9
        name: Jarvis Companion v1.7.9
        body: |
          JARVIS Companion v1.7.9 — Barcha 34 ta O'zbek telekanali, To'g'ri Fullscreen, 3 Nuqtali Tezkor Menyu va Kuchaytirilgan Qur'on AI:
          - Zo'r TV va Barcha 34 ta O'zbekiston telekanali:
            • Famelack rasmiy manbasidan barcha 34 ta O'zbek telekanali (Zo'r TV, Sevimli TV, Milliy TV, MY5, BIZ TV, BIZ Cinema, BIZ Music, Aqlvoy, Bolajon, Dunyo bo'ylab, Kinoteatr, UzReport TV, Sport TV, va h.k.) to'liq qo'shildi.
            • "Zo'r TV ni qo'y" yoki istalgan kanal nomi aytilganda darhol o'sha kanal jonli efirda ochiladi.
          - To'liq ekran (Fullscreen) to'g'irlandi:
            • Ekran ag'darilib Jarvis UI buzilib ketishi butunlay to'xtatildi (android:configChanges to'liq joriy etildi).
            • Video 100% ekranni egallaydi va ekrandan chiqish uchun qulay ✕ tugmasi qo'yildi.
          - Qur'on AI TV interfeysidan chiqarildi va 3 Nuqtali Kiber Menyu qo'shildi:
            • TV UI pastki panelidan Qur'on AI olib tashlandi (faqat Asosiy, TV, Musiqa qoldi).
            • Jarvis logotipi tagiga 3 ta nuqta (•••) qo'yildi. Bosilganda nafis, zamonaviy menyu ochiladi:
              1. Qur'on AI (Tajvid, Tilovat va Ovozli tekshirish)
              2. Barcha TV (3D Globus va 34 ta telekanal)
              3. Eslatmalar (Reja, vazifalar va budilnik)
          - Qur'on AI Tubdan Kuchaytirildi:
            • 3 xil ko'rinish tanlash imkoni:
              1. Kitobli ko'rinish (Haqiqiy Mushaf sahifasi, oltin naqshli hoshiya va oyat belgilari)
              2. Tajvidli ko'rinish (Ixfo, Qalqala, Madd, G'unna ranglari bilan oyatma-oyat)
              3. Takrorlab o'qish (Yodlash rejimi: 1x, 3x, 5x, 10x, ∞ cheksiz takrorlash va qori orqasidan qaytarish)
            • O'qishni haqiqiy 2 tomonlama Android ovozli tanib olish (SpeechRecognizer ar-SA) orqali tekshirish.
            • Qorilar qiroati (Abdulbosit Mujawwad, Husariy, Afosiy, G'omdiy).
          - Ilovalarni ochish:
            • "YouTube ni och" va "Telegram ni och" buyruqlari kafolatli ishga tushirildi.
        files: app/build/outputs/apk/debug/app-debug.apk

