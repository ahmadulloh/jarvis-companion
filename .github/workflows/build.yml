name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.5
        name: Jarvis Companion v1.7.5
        body: |
          JARVIS Companion v1.7.5 yangilanishi — Yangi 4-Tabli Yagona UI & Jonli TV / 3D Globus (1, 2, 3-rasmlar dizayni asosida):
          - 1-rasm (Asosiy / Home): 3D rangli Yer globusi, Jonli TV (O'zbekiston 24) prevyu kartasi, 2-ustunli kanallar (Aqlvoy, BIZ Cinema, BIZ TV, Bolajon, Cheksiz TV, Dasturxon TV, Dunyo bo'ylab, Farg'ona MTRK, Sport TV, Sevimli TV, Zo'r TV).
          - 3-rasm (TV Tab): 16:9 Jonli HD video pleer, soxta 0:12/0:30 taymersiz haqiqiy jonli boshqaruv (Pauza/Play, Ovoz slayderi, ● LIVE qizil yorug'lik, HD, To'liq ekran), kanal ma'lumot banneri va ⭐ Sevimlilar, toifalar (Barchasi, Sport, Kino, Yangiliklar, Bolalar, Musiqa, Dunyo) va 2-ustunli brendli logotipli kanallar kartalari.
          - 3-tab (Musiqa): Yaratuvchan Spotify-uslubidagi musiqa pleeri, aylanuvchi vinil disk, chastotali audio vizualizator, O'zbekiston xitlari (Hurshid Rasulov, Shohruhxon, Yulduz Usmonova, Munisa Rizayeva, Rayhon) va haqiqiy vaqtli progress bar.
          - 4-tab (Chat): ChatGPT uslubidagi qulay interaktiv AI muloqot oynasi, tezkor taklif chipchalari (Bugungi yangiliklar, Ob-havo, Sport TV, Qur'on darsi) va Markdown formatlash.
          - Status Bar to'qnashuvi tuzatildi: Telefonning soat va batareya paneli bilan xunuk ustma-ust tushgan sarlavha olib tashlandi, safe area insets to'liq moslashtirildi.
          - Yagona pastki panel (Dock + Input Bar): Qayerda bo'lishingizdan qat'i nazar 4 ta tab va 📎 Fayl biriktirish, Buyruq yozish, 🎙️ Mikrofon va ➤ Yuborish tugmalari hamisha bir teginishda mavjud.
        files: app/build/outputs/apk/debug/app-debug.apk

