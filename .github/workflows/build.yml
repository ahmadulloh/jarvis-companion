name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.6.9
        name: Jarvis Companion v1.6.9
        body: |
          JARVIS Companion v1.6.9 yangilanishi:
          - Gemini Live 5 ta haqiqiy ovozlari (Charon, Puck, Kore, Fenrir, Aoede) to'liq ishga tushirildi va sinov tugmasi bosilganda har birining o'ziga xos jonli ovozi yangraydi.
          - Yordamchi nomi (Assistant Name) Sozlamalarda faqat va faqat JARVIS nomiga doimiy qulflab qo'yildi (hech kim o'zgartira olmaydi).
          - YouTube musiqa va videolari to'g'ridan-to'g'ri ilova ichida avtomatik ijro etiladi (tashqi ilovaga chiqib ketish to'xtatildi).
          - Hujjat skanerlash va tahlil qilishdagi 429 RESOURCE_EXHAUSTED kvota xatosi ko'p modelli kaskad (gemini-3.5-flash, gemini-3.7-flash, gemini-3.1-flash-lite) orqali to'liq bartaraf etildi.
          - Sozlamalarda ovoz tanlangach, saqlash tugmasi bosilishi bilan servis yangi tanlangan ovoz bilan darhol qayta ulanadi.
        files: app/build/outputs/apk/debug/app-debug.apk

