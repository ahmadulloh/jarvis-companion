name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.6.4
        name: Jarvis Companion v1.6.4
        body: |
          JARVIS Companion v1.6.4 yangilanishi:
          - Yangi Google Gemini Pro API kaliti to'liq ulandi (cheksiz kvota, ustuvor navbat)
          - Official Google Gemini asl ovozi (Kore/Puck) 1.5 soniyada chaqmoqdek tezlikda javob qaytaradi
          - 24kHz Mono PCM WAV konteyneri to'liq tozalangan, oxiridagi shivirash/hiss tovushlari 100% yo'qotilgan
          - Standart ulanish Eskiz VPS Cloud Gateway (77.83.206.138:8000) ga avtomatik sozlangan
          - YouTube musiqa, telefon ilovalari (YouTube, Spotify, Telegram) va barcha buyruqlar to'liq ishlaydi
        files: app/build/outputs/apk/debug/app-debug.apk

