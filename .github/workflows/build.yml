name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.6.3
        name: Jarvis Companion v1.6.3
        body: |
          JARVIS Companion v1.6.3 yangilanishi:
          - Android 11+ da barcha ilovalarni (YouTube, Spotify, Telegram, va barcha ilovalar) to'liq ochish qo'llab-quvvatlandi
          - YouTube musiqa va videolarni to'g'ridan-to'g'ri YouTube orqali ijro etish
          - 30 soniyalik barqaror ping va uzilishlarda xavotirsiz fonda tiklanish (exponential backoff)
          - Eskiz VPS Cloud Gateway bilan to'liq integratsiya
        files: app/build/outputs/apk/debug/app-debug.apk

