name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.6
        name: Jarvis Companion v1.7.6
        body: |
          JARVIS Companion v1.7.6 — Qur'on AI Ustozi Yangilanishi (Foydalanuvchi taqdim etgan dizayn asosida):
          - Sarlavha: Yashil Qur'on nishoni, "Qur'on AI" sarlavhasi, "Alloh kalomi — har doim siz bilan" shiori va 🔍 Sura qidiruv hamda ⚙️ Sozlamalar tugmalari.
          - 4 ta toifa tugmalari (Pills): 📖 Qiroat (faol yashil), 📄 Tafsir, 🌐 Tarjima, 💡 Hikmat.
          - Sura banner kartasi: Islomiy masjid arkalari va muqaddas Qur'on kitobi surati, ← qaytish tugmasi, "Al-Fotiha" va "Makkiy, 7 oyat" tavsifi.
          - 1-oyat ko'rgazmasi: "1-oyat / 7" nishoni, markaziy ❖ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ❖ xattotligi, lotin transkripsiyasi va mint tusli o'zbekcha ma'nolar tarjimasi kartasi.
          - Asosiy audio pleyer paneli: 🔊 Qori tanlash (Abdulbosit Mujavvad, Husoriy Muallim, Afosiy, G'omdiy), ⏮ Oldingi, ⏸/▶ Aylana yashil Play/Pause tugmasi, ⏭ Keyingi, ⏱ 1.0x tezlik sozlagichi.
          - 🎙️ O'qishni tekshirish (AI Tajweed & Talaffuz nazoratchisi): Yashil yoqish/o'chirish svitchi, jonli mikrofon, Al-Fotiha surasining barcha 7 oyati (har biri uchun alohida 🔊 tinglash tugmasi, arabcha matn, lotincha o'qilishi va tasdiq nishoni).
          - O'qish xatosini aniqlash (3-oyat ko'rinishi): Yumshoq qizil fonda xato talaffuz qilingan so'z to'lqinli qizil chiziq bilan belgilanadi, ✖ qizil xoch nishoni va aniq o'zbekcha tuzatish: 'Xato: "ar-Rahmoni" deb, "ar-rohmāni" emas'.
          - O'ng boshqaruv ustuni: ⚡ O'qish rejimi (Oddiy, Zikr/takror, Tungi rejim), 🎙️ Qiroat uslubi, 🔊 Ovoz balandligi slayderi, 🔊 Xatolarni ko'rsatish svitchi, AA Yozuv o'lchamini kattalashtirish slayderi, va "Qur'on AI - Ilm, huzur va nur siz bilan" brend kartasi.
          - To'liq oflayn va tezkor: Barcha ma'lumotlar statik saqlangan, 0 soniyada yuklanadi, tarmoq uzilsa ham avtomatik lokal aktivga o'tadi.
        files: app/build/outputs/apk/debug/app-debug.apk

