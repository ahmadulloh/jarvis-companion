name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.1
        name: Jarvis Companion v1.7.1
        body: |
          JARVIS Companion v1.7.1 yangilanishi:
          - Video chekalari silliq va sifatli qilib 20dp CardView bilan o'raldi, qirrali nuqsonlar butunlay yo'qotildi (1-rasm dizayni).
          - Kattalashtirish (⛶) tugmasi bosilganda to'liq ekranni egallaydi, orqaga (Back) bosilganda video silliq kichrayadi.
          - YouTube iframe postMessage orqali pauza (II), ijro (▶), oldingi va keyingi tugmalari 100% to'liq ishlaydi.
          - Sozlamalardagi Ovoz chiqish qurilmasi (Telefon, Quloqchin, PC) yashil hoshiyali tanlanish ko'rinishiga ega bo'ldi va sozlamalar xotirada saqlanadi (2-rasm dizayni).
          - Rasm va hujjat yuklanganda (PDF, Word, Excel, TXT, Rasm) Yurist rejimiga majburiy o'tib ketish to'xtatildi, faol rejim saqlanadi.
          - Pastki qismda Image 3 dizayni: Yashil (+) tugmasi orqali rasm/hujjat yuklanadi, yuborishdan oldin ko'rinib turadi, yuborilgach asosiy ekranda jonli chat xabari sifatida savol va javob ko'rinadi (hech qanday xalaqit beruvchi popup muloqot oynasisiz).
        files: app/build/outputs/apk/debug/app-debug.apk

