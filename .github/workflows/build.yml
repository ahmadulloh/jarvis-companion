name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.8.1
        name: Jarvis Companion v1.8.1
        body: |
          JARVIS Companion v1.8.1 — Yangi Imkoniyatlar (HTTPS Domen, Server TTS Ovozlar & Rasm Chizish):
          - 3 Chiziqcha (— — —) Tezkor Menyu:
            • Logo ostidagi nuqtalar chiziqchalarga (— — —) almashtirildi.
            • Menyuga 5 ta asosiy bo'lim kiritildi: Qur'on AI, Barcha TV, Eslatmalar, Kunlik Rejam va Kamera AI.
          - 📅 Kunlik Rejam (Kalendar):
            • Haftaning barcha kunlari (Dushanba - Yakshanba) bo'yicha soatbay reja tuzish (09:00 - 12:30 Ish, 13:30 - 16:20 O'qish).
            • Ovozli buyruq ("Kunlik rejam", "Rejamni ko'rsat") va qulay interfeys.
          - ⏰ Eslatmalar Ro'yxati:
            • Barcha eslatmalar ro'yxati, yangi eslatma qo'shish va o'chirish.
            • Ovozli buyruq orqali avtomatik eslatmalar ro'yxatiga qo'shish.
          - 📷 Kamera AI Vision va Test Yechish:
            • Kamera orqali ko'rib turgan narsalarni jonli tasvirlab berish.
            • Test savollarini kameraga ko'rsatganda to'g'ri javobini topib berish.
            • Foydalanuvchi savollariga kameradagi tasvir asosida javob berish.
          - 🌍 Barcha TV va Globus yangilanishi:
            • Globusda yoki ro'yxatda Turkiya (TRT 1) yoki boshqa istalgan davlat tanlanganda darhol o'sha davlat kanallari ochiladi va o'ynaydi.
            • Pleer ostidagi telekanallar ro'yxati avtomatik ravishda tanlangan davlat kanallariga yangilanadi.
            • Jonli Musiqa radiosi (BIZ Music, Navo TV, FTV, Muz TV).
          - 📖 Qur'on AI takomillashtirildi:
            • Kitobli (Mushaf), Tajvidli va Takrorlash rejimlari to'liq ishlaydi.
            • Har bir oyat ustiga bosganda darhol qiroat yangraydi va xatoliklar bartaraf etildi.
        files: app/build/outputs/apk/debug/app-debug.apk

