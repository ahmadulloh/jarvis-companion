name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Commit build log on failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build_log.txt
        git commit -m "Auto-commit build log on failure" || true
        git push || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JarvisCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.3
        name: Jarvis Companion v1.7.3
        body: |
          JARVIS Companion v1.7.3 yangilanishi — Qur'on Ustozi AI (Tarteel & Quran.ai):
          - Qur'on Ustozi interfeysi: 114 ta sura, Usmoniy xati, Shayx Muhammad Sodiq Muhammad Yusuf o'zbekcha ma'nolari tarjimasi, Tajvid ranglari.
          - Qorilar tilovati va Takrorlash: Mashhur qorilar (Al-Husariy Muallim, Mishariy Alafasiy, Abdulbosit Mujavvad, Sa'd Al-G'omdiy) qiroati va tinglab takrorlash rejimi.
          - Real vaqt qiroat tahlili va Xatolarni aniqlash: Foydalanuvchi qiroat qilganda mikrofon orqali eshitib, tushib qolgan yoki adashilgan so'zlarni qizil to'lqinli chiziq bilan belgilash, aniqlik foizi (masalan 98.4%) va "Missed words" oynasi bilan o'zbekcha ustoz tavsiyasi.
          - 0 dan Arab alifbosi (Muallimi Soniy): 28 ta arab harfi, maxrajlari (chiqish o'rni), 4 xil yozilish shakli (alohida, boshida, o'rtasida, oxirida) va audio talaffuzi bilan.
          - Kamera orqali Qog'oz Mushaf kuzatuvi: Foydalanuvchi qog'oz Mushafni kameraga qaratganda sahifani tanib olish va tilovatni kuzatib borish.
          - Din / Qur'on sohasi: Tezkor tugmalar va to'liq avtonom tajvid ustozi.
        files: app/build/outputs/apk/debug/app-debug.apk

