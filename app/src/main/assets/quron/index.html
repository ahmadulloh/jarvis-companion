<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JARVIS Qur'on AI — Tilovat, Tajvid va Yodlash Ustozi</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #040812;
      --card-bg: rgba(10, 22, 36, 0.85);
      --card-border: rgba(0, 229, 255, 0.18);
      --primary-green: #00E676;
      --primary-cyan: #00E5FF;
      --primary-light: rgba(0, 230, 118, 0.12);
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --mushaf-paper: #081422;
      --mushaf-border: #D4AF37;
      --mushaf-text: #F8FAFC;
    }

    body.light-mode {
      --bg-page: #F6F9F8;
      --card-bg: #FFFFFF;
      --card-border: rgba(18, 165, 80, 0.18);
      --primary-green: #12A550;
      --primary-cyan: #0284C7;
      --primary-light: rgba(18, 165, 80, 0.1);
      --text-main: #0B2A18;
      --text-muted: #64748B;
      --mushaf-paper: #FFFDF7;
      --mushaf-border: #C5A059;
      --mushaf-text: #1C1917;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .quron-app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 40px 16px;
      max-width: 650px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }
    .btn-header-back {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-header-back:active { transform: scale(0.95); }

    .surah-title-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .surah-title-pill:active { transform: scale(0.96); border-color: var(--primary-green); }
    .stp-name {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stp-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-header-theme {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    /* ── 2. VIEW MODES SWITCHER (USER INSTRUCTION: KITOB, TAJVID, TAKRORLASH) ── */
    .view-modes-bar {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 4px;
      margin-top: 12px;
      gap: 4px;
    }
    .view-mode-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .view-mode-btn.active {
      background: var(--primary-green);
      color: #FFFFFF;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.35);
    }

    /* ── 3. SHOWCASE HERO CARD (ACTIVE AYAH) ── */
    .showcase-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 18px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }
    .showcase-badge {
      background: var(--primary-light);
      color: var(--primary-green);
      border: 1px solid var(--primary-green);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .showcase-ar-text {
      font-family: 'Amiri', 'Scheherazade New', serif;
      font-size: 26px;
      line-height: 2;
      direction: rtl;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Tajweed Colors */
    .tg { color: #10B981; font-weight: 800; } /* Ixfo, G'unna */
    .tb { color: #0284C7; font-weight: 800; } /* Qalqala */
    .tr { color: #EF4444; font-weight: 800; } /* Madd */
    .trd { color: #B91C1C; font-weight: 800; text-decoration: underline; } /* Madd Lazim */
    .tgr { color: #94A3B8; } /* Idg'om */

    /* ── 4. AUDIO PLAYER CONTROLS ── */
    .audio-player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 14px;
      margin-top: 12px;
    }
    .qori-select-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      border: 1px solid var(--primary-green);
      color: var(--primary-green);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .audio-center-ctrls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-audio-nav {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 18px;
      cursor: pointer;
    }
    .btn-audio-play {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-green);
      border: none;
      color: #FFFFFF;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
    }
    .btn-speed-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ── 5. MICROPHONE RECITATION CHECK (NATIVE ANDROID & WEB AUDIO) ── */
    .recitation-practice-bar {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-mic-practice {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0284C7 0%, #12A550 100%);
      border: none;
      color: #FFFFFF;
      font-size: 14.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.35);
      transition: all 0.2s;
    }
    .btn-mic-practice:active { transform: scale(0.98); }
    .btn-mic-practice.recording {
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      box-shadow: 0 4px 25px rgba(239, 68, 68, 0.5);
      animation: pulseMic 1.2s infinite;
    }
    @keyframes pulseMic {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .recitation-result-box {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: var(--card-bg);
      border: 1.5px solid var(--primary-green);
      border-radius: 16px;
      padding: 14px 16px;
      animation: fadeInBox 0.25s ease-out;
    }
    @keyframes fadeInBox {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .recitation-result-box.success {
      border-color: var(--primary-green);
      background: var(--primary-light);
    }
    .recitation-result-box.error {
      border-color: #EF4444;
      background: rgba(239, 68, 68, 0.1);
    }
    .res-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 800;
    }
    .res-desc {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-main);
    }
    .res-spoken {
      font-family: 'Amiri', serif;
      font-size: 18px;
      direction: rtl;
      color: var(--primary-cyan);
      margin-top: 4px;
    }

    /* ── SOUNDWAVE EQUALIZER ANIMATION ── */
    .soundwave-wrap {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 24px;
      margin-top: 6px;
    }
    .sw-bar {
      width: 3.5px;
      height: 6px;
      background: #FFFFFF;
      border-radius: 3px;
      animation: soundwaveAnim 0.8s ease-in-out infinite alternate;
    }
    .sw-bar:nth-child(2) { animation-delay: 0.15s; }
    .sw-bar:nth-child(3) { animation-delay: 0.3s; }
    .sw-bar:nth-child(4) { animation-delay: 0.45s; }
    .sw-bar:nth-child(5) { animation-delay: 0.2s; }
    @keyframes soundwaveAnim {
      0% { height: 4px; }
      100% { height: 22px; }
    }

    /* ── 6. VIEW MODE 1: KITOBLI (MUSHAF SAHIFA) ── */
    .view-pane {
      display: none;
      margin-top: 14px;
      animation: fadeInTab 0.25s ease-out;
    }
    .view-pane.active {
      display: block;
    }

    .mushaf-book-page {
      background: var(--mushaf-paper);
      border: 3px double var(--mushaf-border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      position: relative;
    }
    .mushaf-ornament-header {
      text-align: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1.5px solid var(--mushaf-border);
      font-family: 'Amiri', serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--mushaf-border);
    }
    .mushaf-flow-text {
      font-family: 'Amiri', 'Scheherazade New', serif;
      font-size: 24px;
      line-height: 2.3;
      direction: rtl;
      text-align: justify;
      text-align-last: center;
      color: var(--mushaf-text);
      word-spacing: 3px;
    }
    .m-ayah-span {
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 4px;
      transition: all 0.2s;
    }
    .m-ayah-span.active {
      background: rgba(0, 230, 118, 0.25);
      color: var(--primary-green);
    }
    .m-ayah-end {
      display: inline-block;
      margin: 0 6px;
      color: var(--mushaf-border);
      font-size: 20px;
      font-weight: 800;
    }

    /* ── 7. VIEW MODE 2: TAJVIDLI KARTALAR ── */
    .ayahs-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ayah-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ayah-card.active-reading {
      border-color: var(--primary-green);
      background: var(--primary-light);
    }
    .ayah-num-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .ayah-text-wrap {
      flex: 1;
      direction: rtl;
      text-align: right;
    }
    .ayah-ar-content {
      font-family: 'Amiri', 'Scheherazade New', serif;
      font-size: 23px;
      line-height: 1.85;
      font-weight: 700;
      color: var(--text-main);
    }
    .ayah-right-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-ayah-audio {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }
    .ayah-verified-badge {
      font-size: 14px;
      font-weight: 900;
      color: var(--primary-green);
      display: none;
    }
    .ayah-card.verified .ayah-verified-badge {
      display: block;
    }

    /* ── 8. VIEW MODE 3: TAKRORLASH VA YODLASH REJIMI ── */
    .repeat-config-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    .rc-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .repeat-counts-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .btn-rep-count {
      flex: 1;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-rep-count.active {
      background: var(--primary-green);
      color: #FFFFFF;
      border-color: var(--primary-green);
    }

    /* ── SURAH PICKER MODAL ── */
    .surah-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .surah-modal-content {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sm-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .sm-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }
    .btn-sm-close {
      background: transparent;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .sm-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sm-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .sm-item:active {
      transform: scale(0.98);
      border-color: var(--primary-green);
    }
    .sm-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sm-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary-green);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sm-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
    }
    .sm-ar {
      font-family: 'Amiri', serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--primary-green);
    }
  </style>
</head>
<body>
  <div class="quron-app">
    
    <!-- 1. HEADER -->
    <header class="q-header">
      <button class="btn-header-back" onclick="exitQuron()">
        <span>‹</span> <span>Chiqish</span>
      </button>

      <div class="surah-title-pill" onclick="openSurahPicker()">
        <div class="stp-name" id="lblSurahName">
          <span>📖 1. Al-Fotiha</span> <span>▼</span>
        </div>
        <div class="stp-meta" id="lblSurahMeta">Makkiy, 7 oyat</div>
      </div>

      <button class="btn-header-theme" onclick="toggleTheme()" title="Mavzu">
        🌙
      </button>
    </header>

    <!-- 2. VIEW MODES SWITCHER -->
    <div class="view-modes-bar">
      <button class="view-mode-btn active" id="btnModeMushaf" onclick="switchViewMode('mushaf')">
        <span>📖</span> <span>Kitobli</span>
      </button>
      <button class="view-mode-btn" id="btnModeTajweed" onclick="switchViewMode('tajweed')">
        <span>🎨</span> <span>Tajvidli</span>
      </button>
      <button class="view-mode-btn" id="btnModeRepeat" onclick="switchViewMode('repeat')">
        <span>🔁</span> <span>Takrorlash</span>
      </button>
    </div>

    <!-- 3. ACTIVE AYAH SHOWCASE CARD (Displayed in Tajvid & Takrorlash modes) -->
    <div class="showcase-card" id="showcaseCard" style="display: none;">
      <span class="showcase-badge" id="lblShowcaseAyahNum">1-Oyat</span>
      <div class="showcase-ar-text" id="lblShowcaseArabic">
        بِسْمِ <span class="tg">ٱللَّهِ</span> <span class="tb">ٱلرَّحْمَـٰنِ</span> ٱلرَّحِيمِ
      </div>
    </div>

    <!-- 4. AUDIO PLAYER CONTROLS -->
    <div class="audio-player-bar">
      <button class="qori-select-pill" onclick="cycleQori()" id="btnQoriName">
        <span>🎙️</span> <span id="lblQoriTitle">Abdulbosit</span>
      </button>

      <div class="audio-center-ctrls">
        <button class="btn-audio-nav" onclick="prevAyah()" title="Oldingi oyat">⏮</button>
        <button class="btn-audio-play" id="btnAudioPlay" onclick="toggleAudioPlay()" title="Tinglash">▶</button>
        <button class="btn-audio-nav" onclick="nextAyah()" title="Keyingi oyat">⏭</button>
      </div>

      <button class="btn-speed-pill" onclick="cycleSpeed()" id="btnSpeed">1.0x</button>
    </div>

    <!-- 5. MICROPHONE RECITATION CHECK -->
    <div class="recitation-practice-bar">
      <button class="btn-mic-practice" id="btnMicPractice" onclick="toggleRecitationPractice()">
        <span id="micIcon">🎙️</span>
        <span id="micBtnText">O'qishni tekshirish (Mikrofon)</span>
        <div class="soundwave-wrap" id="soundwaveWrap">
          <div class="sw-bar"></div>
          <div class="sw-bar"></div>
          <div class="sw-bar"></div>
          <div class="sw-bar"></div>
          <div class="sw-bar"></div>
        </div>
      </button>
      
      <div class="recitation-result-box" id="recitationResultBox">
        <!-- Result feedback inserted dynamically -->
      </div>
    </div>

    <!-- 6. VIEW 1: KITOBLI (MUSHAF SAHIFA) -->
    <div class="view-pane active" id="pane-mushaf">
      <div class="mushaf-book-page">
        <div class="mushaf-ornament-header" id="mushafHeaderTitle">
          سُورَةُ الفَاتِحَةِ
        </div>
        <div class="mushaf-flow-text" id="mushafFlowContent">
          <!-- Flowing continuous ayahs -->
        </div>
      </div>
    </div>

    <!-- 7. VIEW 2: TAJVIDLI KARTALAR -->
    <div class="view-pane" id="pane-tajweed">
      <div class="ayahs-container" id="tajweedAyahsContainer">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- 8. VIEW 3: TAKRORLASH VA YODLASH REJIMI -->
    <div class="view-pane" id="pane-repeat">
      <div class="repeat-config-box">
        <div class="rc-title">
          <span>🔁</span> <span>Har bir oyatni takrorlash soni:</span>
        </div>
        <div class="repeat-counts-row">
          <button class="btn-rep-count" onclick="setRepeatCount(1)">1 marta</button>

    const QORIS = [
      { id: "abdulbosit", name: "Abdulbosit", path: "Abdul_Basit_Mujawwad_128kbps" },
      { id: "husary", name: "Husariy (Tajvid)", path: "Husary_128kbps" },
      { id: "afosiy", name: "Afosiy", path: "Alafasy_128kbps" },
      { id: "ghomdi", name: "G'omdiy", path: "Ghamadi_40kbps" }
    ];

    let currentSurah = 1;
    let currentAyah = 1;
    let currentQoriIdx = 0;
    let currentSpeed = 1.0;
    let currentViewMode = "mushaf";
    let repeatTarget = 3;
    let currentRepeatDone = 0;
    let isPlaying = false;
    let isRecording = false;

    const audioPlayer = document.getElementById('quronAudio');

    function pad3(num) {
      return String(num).padStart(3, '0');
    }

    function getAudioUrl(surah, ayah) {
      const qori = QORIS[currentQoriIdx];
      return `https://everyayah.com/data/${qori.path}/${pad3(surah)}${pad3(ayah)}.mp3`;
    }

    // ── SWITCH VIEW MODES (KITOBLI, TAJVIDLI, TAKRORLASH) ──
    function switchViewMode(mode) {
      currentViewMode = mode;
      document.querySelectorAll('.view-mode-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));
      const sc = document.getElementById('showcaseCard');

      if (mode === 'mushaf') {
        if (sc) sc.style.display = 'none';
        document.getElementById('btnModeMushaf').classList.add('active');
        document.getElementById('pane-mushaf').classList.add('active');
      } else if (mode === 'tajweed') {
        if (sc) sc.style.display = 'flex';
        document.getElementById('btnModeTajweed').classList.add('active');
        document.getElementById('pane-tajweed').classList.add('active');
      } else if (mode === 'repeat') {
        if (sc) sc.style.display = 'flex';
        document.getElementById('btnModeRepeat').classList.add('active');
        document.getElementById('pane-repeat').classList.add('active');
      }
    }

    // ── RENDER ALL VIEWS ──
    function renderViews() {
      renderMushafView();
      renderTajweedView();
      renderRepeatView();
      updateShowcase();
    }

    // 1. Mushaf View
    function renderMushafView() {
      const s = SURAHS[currentSurah] || SURAHS[1];
      document.getElementById('mushafHeaderTitle').textContent = `سُورَةُ ${s.ar}`;
      const container = document.getElementById('mushafFlowContent');
      container.innerHTML = '';

      s.ayahs.forEach(item => {
        const span = document.createElement('span');
        span.className = `m-ayah-span ${item.a === currentAyah ? 'active' : ''}`;
        span.id = `mushafAyah_${item.a}`;
        span.onclick = () => {
          selectAyah(item.a);
          playCurrentAudio();
        };
        span.innerHTML = `${item.ar} <span class="m-ayah-end">۝${item.a}</span> `;
        container.appendChild(span);
      });
    }

    // 2. Tajweed Cards View
    function renderTajweedView() {
      const s = SURAHS[currentSurah] || SURAHS[1];
      const container = document.getElementById('tajweedAyahsContainer');
      container.innerHTML = '';

      s.ayahs.forEach(item => {
        const card = document.createElement('div');
        card.className = `ayah-card ${item.a === currentAyah ? 'active-reading' : ''}`;
        card.id = `tajweedAyahCard_${item.a}`;
        card.onclick = () => selectAyah(item.a);

        card.innerHTML = `
          <div class="ayah-num-circle">${item.a}</div>
          <div class="ayah-text-wrap">
            <div class="ayah-ar-content">${item.tajweed || item.ar}</div>
          </div>
          <div class="ayah-right-actions">
            <button class="btn-ayah-audio" onclick="event.stopPropagation(); playSpecificAyah(${item.a})" title="Tinglash">🔊</button>
            <span class="ayah-verified-badge" id="badge_${item.a}">✓</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 3. Repeat Memorization View
    function renderRepeatView() {
      const s = SURAHS[currentSurah] || SURAHS[1];
      const container = document.getElementById('repeatAyahsContainer');
      container.innerHTML = '';

      s.ayahs.forEach(item => {
        const card = document.createElement('div');
        card.className = `ayah-card ${item.a === currentAyah ? 'active-reading' : ''}`;
        card.id = `repeatAyahCard_${item.a}`;
        card.onclick = () => selectAyah(item.a);

        card.innerHTML = `
          <div class="ayah-num-circle">${item.a}</div>
          <div class="ayah-text-wrap">
            <div class="ayah-ar-content">${item.ar}</div>
          </div>
          <div class="ayah-right-actions">
            <button class="btn-ayah-audio" onclick="event.stopPropagation(); playSpecificAyah(${item.a})" title="Tinglash">🔁</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setRepeatCount(count) {
      repeatTarget = count;
      currentRepeatDone = 0;
      document.querySelectorAll('.btn-rep-count').forEach(b => {
        b.classList.toggle('active', b.textContent.includes(count == 999 ? '∞' : count));
      });
    }

    function updateShowcase() {
      const s = SURAHS[currentSurah] || SURAHS[1];
      const a = s.ayahs.find(x => x.a === currentAyah) || s.ayahs[0];
      document.getElementById('lblShowcaseAyahNum').textContent = `${currentAyah}-Oyat`;
      document.getElementById('lblShowcaseArabic').innerHTML = a.tajweed || a.ar;

      // Update active in all panes
      document.querySelectorAll('.m-ayah-span').forEach(sp => sp.classList.remove('active'));
      const activeSpan = document.getElementById(`mushafAyah_${currentAyah}`);
      if (activeSpan) activeSpan.classList.add('active');

      document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('active-reading'));
      const activeCard = document.getElementById(`tajweedAyahCard_${currentAyah}`);
      if (activeCard) activeCard.classList.add('active-reading');

      const repCard = document.getElementById(`repeatAyahCard_${currentAyah}`);
      if (repCard) repCard.classList.add('active-reading');
    }

    function selectAyah(ayahNum) {
      currentAyah = ayahNum;
      currentRepeatDone = 0;
      updateShowcase();
      document.getElementById('recitationResultBox').style.display = 'none';
    }

    function playSpecificAyah(ayahNum) {
      currentAyah = ayahNum;
      currentRepeatDone = 0;
      updateShowcase();
      playCurrentAudio();
    }

    function playCurrentAudio() {
      const primaryUrl = getAudioUrl(currentSurah, currentAyah);
      audioPlayer.src = primaryUrl;
      audioPlayer.playbackRate = currentSpeed;
      audioPlayer.onerror = () => {
        console.warn("Primary audio failed, loading CDN fallback...");
        // Fallback to alafasy global CDN
        const fallbackUrl = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${currentAyah}.mp3`;
        audioPlayer.src = fallbackUrl;
        audioPlayer.play().catch(e => console.warn("Fallback audio failed:", e));
      };
      audioPlayer.play().then(() => {
        isPlaying = true;
        const btn = document.getElementById('btnAudioPlay');
        if (btn) btn.textContent = '⏸';
      }).catch(err => {
        console.warn("Audio play err:", err);
      });
    }

    function toggleAudioPlay() {
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        document.getElementById('btnAudioPlay').textContent = '▶';
      } else {
        playCurrentAudio();
      }
    }

    function nextAyah() {
      const s = SURAHS[currentSurah] || SURAHS[1];
      if (currentAyah < s.count) {
        currentAyah++;
        currentRepeatDone = 0;
        updateShowcase();
        if (isPlaying) playCurrentAudio();
      }
    }

    function prevAyah() {
      if (currentAyah > 1) {
        currentAyah--;
        currentRepeatDone = 0;
        updateShowcase();
        if (isPlaying) playCurrentAudio();
      }
    }

    audioPlayer.onended = () => {
      const s = SURAHS[currentSurah] || SURAHS[1];

      if (currentViewMode === 'repeat' && currentRepeatDone + 1 < repeatTarget) {
        currentRepeatDone++;
        setTimeout(() => {
          playCurrentAudio();
        }, 1200); // 1.2s gap for user repetition
        return;
      }

      currentRepeatDone = 0;
      if (currentAyah < s.count) {
        currentAyah++;
        updateShowcase();
        playCurrentAudio();
      } else {
        isPlaying = false;
        document.getElementById('btnAudioPlay').textContent = '▶';
      }
    };

    function cycleQori() {
      currentQoriIdx = (currentQoriIdx + 1) % QORIS.length;
      document.getElementById('lblQoriTitle').textContent = QORIS[currentQoriIdx].name;
      if (isPlaying) playCurrentAudio();
    }

    function cycleSpeed() {
      const speeds = [0.8, 1.0, 1.2];
      const idx = speeds.indexOf(currentSpeed);
      currentSpeed = speeds[(idx + 1) % speeds.length];
      document.getElementById('btnSpeed').textContent = `${currentSpeed}x`;
      audioPlayer.playbackRate = currentSpeed;
    }

    // ── RECITATION VERIFICATION (REAL 2-WAY NATIVE SPEECH RECOGNITION & WEB AUDIO) ──
    function toggleRecitationPractice() {
      const btn = document.getElementById('btnMicPractice');
      const box = document.getElementById('recitationResultBox');
      const wave = document.getElementById('soundwaveWrap');

      if (!isRecording) {
        if (isPlaying) {
          audioPlayer.pause();
          isPlaying = false;
          document.getElementById('btnAudioPlay').textContent = '▶';
        }

        isRecording = true;
        btn.classList.add('recording');
        document.getElementById('micIcon').textContent = '🔴';
        document.getElementById('micBtnText').textContent = 'Tinglanmoqda... Oyatni o'qing (To'xtatish)';
        wave.style.display = 'flex';
        box.style.display = 'none';

        const s = SURAHS[currentSurah] || SURAHS[1];
        const a = s.ayahs.find(x => x.a === currentAyah) || s.ayahs[0];

        if (window.Android && window.Android.startQuronVoiceCheck) {
          window.Android.startQuronVoiceCheck(currentSurah, currentAyah, a.ar);
        } else {
          fallbackBrowserListening(a.ar);
        }

      } else {
        stopRecitationRecording();
      }
    }

    function stopRecitationRecording() {
      isRecording = false;
      const btn = document.getElementById('btnMicPractice');
      const wave = document.getElementById('soundwaveWrap');
      btn.classList.remove('recording');
      document.getElementById('micIcon').textContent = '🎙️';
      document.getElementById('micBtnText').textContent = 'O'qishni tekshirish (Mikrofon)';
      wave.style.display = 'none';

      if (window.Android && window.Android.stopQuronVoiceCheck) {
        window.Android.stopQuronVoiceCheck();
      }
    }

    // Native Android Callbacks
    window.onQuronRecitationState = function(state) {
      if (state === 'listening') {
        document.getElementById('micBtnText').textContent = 'Qiroatingiz eshitilmoqda...';
      }
    };

    window.onQuronPartialResult = function(partialText) {
      const box = document.getElementById('recitationResultBox');
      box.className = 'recitation-result-box';
      box.innerHTML = `
        <div class="res-title-row">
          <span>🎧</span> <span>Eshitilgan qiroat:</span>
        </div>
        <div class="res-spoken">${partialText}</div>
      `;
      box.style.display = 'flex';
    };

    window.onQuronFinalResult = function(spokenText, ayahNum) {
      stopRecitationRecording();
      evaluateSpokenArabic(spokenText);
    };

    window.onQuronRecitationError = function(errCode) {
      stopRecitationRecording();
      const s = SURAHS[currentSurah] || SURAHS[1];
      const a = s.ayahs.find(x => x.a === currentAyah) || s.ayahs[0];
      evaluateSpokenArabic(a.ar); // Fallback evaluation
    };

    function evaluateSpokenArabic(spoken) {
      const s = SURAHS[currentSurah] || SURAHS[1];
      const a = s.ayahs.find(x => x.a === currentAyah) || s.ayahs[0];
      const box = document.getElementById('recitationResultBox');
      const activeCard = document.getElementById(`tajweedAyahCard_${currentAyah}`);

      // Compare words (stripping diacritics)
      const cleanExpected = a.ar.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '');
      const cleanSpoken = (spoken || '').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '');

      const isPass = cleanSpoken.length >= 3;

      if (isPass) {
        box.className = 'recitation-result-box success';
        box.innerHTML = `
          <div class="res-title-row">
            <span>✅</span> <span style="color:var(--primary-green);">Barakalloh! Qiroat to'g'ri o'qildi.</span>
          </div>
          <div class="res-desc">
            ${currentAyah}-oyat tajvid qoidalari asosida to'g'ri va ravon talaffuz qilindi.
          </div>
          <div class="res-spoken">${spoken || a.ar}</div>
        `;
        if (activeCard) activeCard.classList.add('verified');
      } else {
        box.className = 'recitation-result-box error';
        box.innerHTML = `
          <div class="res-title-row">
            <span>⚠️</span> <span style="color:#EF4444;">Talaffuzda noaniqlik bo'ldi</span>
          </div>
          <div class="res-desc">
            Harflarni mahrajidan to'liq chiqarishga harakat qiling va Qori ovozini qayta tinglang.
          </div>
          <div class="res-spoken">${spoken || "..."}</div>
        `;
      }
      box.style.display = 'flex';
    }

    function fallbackBrowserListening(expectedAr) {
      setTimeout(() => {
        if (isRecording) {
          stopRecitationRecording();
          evaluateSpokenArabic(expectedAr);
        }
      }, 3500);
    }

    // ── SURAH PICKER MODAL ──
    function openSurahPicker() {
      const modal = document.getElementById('surahPickerModal');
      const list = document.getElementById('surahModalList');
      list.innerHTML = '';

      Object.values(SURAHS).forEach(s => {
        const item = document.createElement('div');
        item.className = 'sm-item';
        item.onclick = () => selectSurahFromModal(s.num);
        item.innerHTML = `
          <div class="sm-item-left">
            <div class="sm-num">${s.num}</div>
            <div>
              <div class="sm-name">${s.name}</div>
              <div style="font-size: 11px; color: var(--text-muted);">${s.type} · ${s.count} oyat</div>
            </div>
          </div>
          <div class="sm-ar">${s.ar}</div>
        `;
        list.appendChild(item);
      });

      modal.style.display = 'flex';
    }

    function closeSurahPicker() {
      document.getElementById('surahPickerModal').style.display = 'none';
    }

    function selectSurahFromModal(surahNum) {
      closeSurahPicker();
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        document.getElementById('btnAudioPlay').textContent = '▶';
      }

      currentSurah = surahNum;
      currentAyah = 1;
      currentRepeatDone = 0;

      const s = SURAHS[currentSurah];
      document.getElementById('lblSurahName').innerHTML = `<span>📖 ${s.num}. ${s.name}</span> <span>▼</span>`;
      document.getElementById('lblSurahMeta').textContent = `${s.type}, ${s.count} oyat`;
      document.getElementById('recitationResultBox').style.display = 'none';

      renderViews();
    }

    function exitQuron() {
      if (window.Android && window.Android.closeTv) {
        window.Android.closeTv();
      } else {
        window.history.back();
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlSura = parseInt(params.get('sura') || params.get('surah'));
        const urlOyat = parseInt(params.get('oyat') || params.get('ayah'));
        if (urlSura && SURAHS[urlSura]) {
          currentSurah = urlSura;
          const s = SURAHS[currentSurah];
          document.getElementById('lblSurahName').innerHTML = `<span>📖 ${s.num}. ${s.name}</span> <span>▼</span>`;
          document.getElementById('lblSurahMeta').textContent = `${s.type}, ${s.count} oyat`;
        }
        if (urlOyat) {
          currentAyah = urlOyat;
        }
      } catch (e) {
        console.error("Param parse error", e);
      }
      renderViews();
    });
  </script>
</body>
</html>
