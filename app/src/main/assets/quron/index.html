        return `https://cdn.islamic.network/quran/audio/128/uz.sodik-audio/${globalNum}.mp3`;
      } else if (qori.type === "everyayah") {
        return `https://everyayah.com/data/${qori.folder}/${pad3(surahNum)}${pad3(ayahNum)}.mp3`;
      }
    }

    // Tajweed regex formatter
    function applyTajweed(arText) {
      if (!arText) return "";
      // Ghunna: Noon or Meem followed by Shaddah (\u0651)
      let t = arText.replace(/([نم][\u0651])/g, '<span class="tg">$1</span>');
      // Qalqala: Qaf, Ta, Ba, Jeem, Dal with Sukoon (\u0652)
      t = t.replace(/([قطبجد][\u0652])/g, '<span class="tb">$1</span>');
      // Madd signs: \u0653 or \u06E1 or ٓ
      t = t.replace(/([^\s]*[ٓ\u0653][^\s]*)/g, '<span class="tr">$1</span>');
      return t;
    }

    // ── SURAH LOADING (LOCAL CACHE + ALQURAN CLOUD API) ──
    async function loadSurahData(surahNum) {
      if (surahCache.has(surahNum)) {
        return surahCache.get(surahNum);
      }

      // Check localStorage
      try {
        const localKey = `q_surah_${surahNum}`;
        const localVal = localStorage.getItem(localKey);
        if (localVal) {
          const parsed = JSON.parse(localVal);
          surahCache.set(surahNum, parsed);
          return parsed;
        }
      } catch (e) {}

      // Fetch from API
      document.getElementById('loadingWrap').style.display = 'flex';
      try {
        const resp = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/quran-uthmani,uz.sodik`);
        const json = await resp.json();
        const uthmani = json.data[0].ayahs;
        const sodik = json.data[1].ayahs;

        const ayahs = [];
        for (let i = 0; i < uthmani.length; i++) {
          ayahs.push({
            a: uthmani[i].numberInSurah,
            g: uthmani[i].number,
            ar: uthmani[i].text,
            uz: sodik[i].text
          });
        }
        surahCache.set(surahNum, ayahs);
        try {
          localStorage.setItem(`q_surah_${surahNum}`, JSON.stringify(ayahs));
        } catch (e) {}

        document.getElementById('loadingWrap').style.display = 'none';
        return ayahs;
      } catch (err) {
        console.error("Failed to fetch surah:", err);
        document.getElementById('loadingWrap').style.display = 'none';
        showToast("Tarmoq xatosi: Oyatlar yuklanmadi");
        return [];
      }
    }

    // ── RENDER VIEWS ──
    async function renderSurah() {
      const meta = SURAHS_META.find(s => s.num === currentSurah) || SURAHS_META[0];
      document.getElementById('lblSurahName').innerHTML = `<span>📖 ${meta.num}. ${meta.name}</span> <span>▼</span>`;
      document.getElementById('lblSurahMeta').textContent = `${meta.type} · ${meta.count} oyat · ${meta.juz}-Pora`;

      const ayahs = await loadSurahData(currentSurah);
      if (!ayahs || ayahs.length === 0) return;

      renderMushafView(meta, ayahs);
      renderTajweedView(ayahs);
      renderRepeatView(ayahs);
      updateActiveAyahDisplay();
    }

    // 1. Mushaf View
    function renderMushafView(meta, ayahs) {
      document.getElementById('mushafHeaderTitle').textContent = `سُورَةُ ${meta.ar}`;
      const bism = document.getElementById('mushafBismillah');
      // Surah 9 (At-Tawbah) does not begin with Bismillah; Surah 1 has it as ayah 1
      if (currentSurah === 9) {
        bism.style.display = 'none';
      } else if (currentSurah === 1) {
        bism.style.display = 'none';
      } else {
        bism.style.display = 'block';
      }

      const container = document.getElementById('mushafFlowContent');
      container.innerHTML = '';

      ayahs.forEach(item => {
        let ar = item.ar;
        // If surah is not Fatiha and ayah 1 starts with Bismillah, trim it for clean presentation
        if (currentSurah !== 1 && item.a === 1 && ar.startsWith("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ")) {
          ar = ar.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ", "");
        }

        const span = document.createElement('span');
        span.className = `m-ayah-span ${item.a === currentAyah ? 'active' : ''}`;
        span.id = `mushafAyah_${item.a}`;
        span.onclick = () => {
          selectAyah(item.a);
          playCurrentAudio();
        };
        span.innerHTML = `${applyTajweed(ar)} <span class="m-ayah-end">۝${item.a}</span> `;
        container.appendChild(span);
      });
    }

    // 2. Tajweed Cards View
    function renderTajweedView(ayahs) {
      const container = document.getElementById('tajweedAyahsContainer');
      container.innerHTML = '';

      ayahs.forEach(item => {
        const card = document.createElement('div');
        card.className = `ayah-card ${item.a === currentAyah ? 'active-reading' : ''}`;
        card.id = `tajweedAyahCard_${item.a}`;
        card.onclick = () => {
          selectAyah(item.a);
          playCurrentAudio();
        };

        card.innerHTML = `
          <div class="ayah-card-top">
            <span class="ayah-num-badge">${item.a}-Oyat</span>
            <button class="btn-ayah-play-mini" onclick="event.stopPropagation(); selectAyah(${item.a}); playCurrentAudio();">▶</button>
          </div>
          <div class="ayah-ar-text">${applyTajweed(item.ar)}</div>
          <div class="ayah-uz-translation" style="display: ${showUzbekTranslation ? 'block' : 'none'};">${item.uz || ''}</div>
        `;
        container.appendChild(card);
      });
    }

    // 3. Repeat Memorization View
    function renderRepeatView(ayahs) {
      const container = document.getElementById('repeatAyahsContainer');
      container.innerHTML = '';

      ayahs.forEach(item => {
        const card = document.createElement('div');
        card.className = `ayah-card ${item.a === currentAyah ? 'active-reading' : ''}`;
        card.id = `repeatAyahCard_${item.a}`;
        card.onclick = () => {
          selectAyah(item.a);
          playCurrentAudio();
        };

        card.innerHTML = `
          <div class="ayah-card-top">
            <span class="ayah-num-badge">${item.a}-Oyat</span>
            <span style="font-size: 11px; color: var(--primary-green); font-weight: 700;">🔁 Yodlash</span>
          </div>
          <div class="ayah-ar-text">${applyTajweed(item.ar)}</div>
          <div class="ayah-uz-translation" style="display: ${showUzbekTranslation ? 'block' : 'none'};">${item.uz || ''}</div>
        `;
        container.appendChild(card);
      });
    }

    // ── ACTIVE AYAH HIGHLIGHT & AUTO-SCROLL ──
    function updateActiveAyahDisplay() {
      const ayahs = surahCache.get(currentSurah);
      const activeAyahObj = (ayahs && ayahs.find(x => x.a === currentAyah)) || (ayahs && ayahs[0]) || { a: currentAyah, ar: "", uz: "" };

      // Update Repeat Status
      document.getElementById('lblRepeatActiveAyah').textContent = `${currentAyah}-oyat`;
      if (repeatType === 'surah') {
        const targetStr = repeatTarget === 999 ? '∞' : repeatTarget;
        document.getElementById('lblRepeatProgress').textContent = `Surani takrorlash: ${surahRepeatsDone} / ${targetStr} marta`;
      } else {
        const targetStr = repeatTarget === 999 ? '∞' : repeatTarget;
        document.getElementById('lblRepeatProgress').textContent = `Oyatni takrorlash: ${ayahRepeatsDone} / ${targetStr} marta`;
      }

      // Update Focus Card in Repeat View
      document.getElementById('lblFocusAyah').textContent = `${currentAyah}-Oyat`;
      document.getElementById('lblFocusArabic').innerHTML = applyTajweed(activeAyahObj.ar);
      document.getElementById('lblFocusUzbek').textContent = activeAyahObj.uz || "";
      document.getElementById('lblFocusUzbek').style.display = showUzbekTranslation ? 'block' : 'none';

      // Update Mushaf Spans
      document.querySelectorAll('.m-ayah-span').forEach(s => s.classList.remove('active'));
      const activeSpan = document.getElementById(`mushafAyah_${currentAyah}`);
      if (activeSpan) {
        activeSpan.classList.add('active');
        if (currentViewMode === 'mushaf') {
          activeSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      // Update Tajweed Cards
      document.querySelectorAll('#tajweedAyahsContainer .ayah-card').forEach(c => c.classList.remove('active-reading'));
      const activeCard = document.getElementById(`tajweedAyahCard_${currentAyah}`);
      if (activeCard) {
        activeCard.classList.add('active-reading');
        if (currentViewMode === 'tajweed') {
          activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      // Update Repeat Cards
      document.querySelectorAll('#repeatAyahsContainer .ayah-card').forEach(c => c.classList.remove('active-reading'));
      const repCard = document.getElementById(`repeatAyahCard_${currentAyah}`);
      if (repCard) repCard.classList.add('active-reading');
    }

    function selectAyah(ayahNum) {
      currentAyah = ayahNum;
      ayahRepeatsDone = 0;
      updateActiveAyahDisplay();
    }

    // ── AUDIO PLAYBACK & TAKRORLASH (REPEAT) SYSTEM ──
    function playCurrentAudio() {
      const url = getAudioUrl(currentSurah, currentAyah);
      audioPlayer.src = url;
      audioPlayer.playbackRate = currentSpeed;

      audioPlayer.onerror = (e) => {
        console.warn("Primary audio failed, falling back to Alafasy CDN:", e);
        const globalNum = getGlobalAyahNumber(currentSurah, currentAyah);
        audioPlayer.src = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalNum}.mp3`;
        audioPlayer.play().catch(err => console.warn("Fallback play error:", err));
      };

      audioPlayer.play().then(() => {
        isPlaying = true;
        document.getElementById('btnAudioPlay').textContent = '⏸';
      }).catch(err => {
        console.warn("Audio play prevented:", err);
      });
    }

    function toggleAudioPlay() {
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        document.getElementById('btnAudioPlay').textContent = '▶';
      } else {
        playCurrentAudio();
      }
    }

    function nextAyah() {
      const meta = SURAHS_META.find(s => s.num === currentSurah);
      if (currentAyah < meta.count) {
        currentAyah++;
        ayahRepeatsDone = 0;
        updateActiveAyahDisplay();
        if (isPlaying) playCurrentAudio();
      } else {
        showToast("Suraning oxirgi oyati");
      }
    }

    function prevAyah() {
      if (currentAyah > 1) {
        currentAyah--;
        ayahRepeatsDone = 0;
        updateActiveAyahDisplay();
        if (isPlaying) playCurrentAudio();
      }
    }

    // ── THE REPEAT LOOP CORE ──
    audioPlayer.onended = () => {
      const meta = SURAHS_META.find(s => s.num === currentSurah);

      // CASE A: Ayah-by-Ayah Repeat
      if (repeatType === 'ayah') {
        if (ayahRepeatsDone + 1 < repeatTarget) {
          ayahRepeatsDone++;
          updateActiveAyahDisplay();
          setTimeout(() => playCurrentAudio(), 800);
          return;
        } else {
          ayahRepeatsDone = 0;
          if (currentAyah < meta.count) {
            currentAyah++;
            updateActiveAyahDisplay();
            setTimeout(() => playCurrentAudio(), 600);
          } else {
            isPlaying = false;
            document.getElementById('btnAudioPlay').textContent = '▶';
            showToast("✅ Oyatlar takrori yakunlandi");
          }
          return;
        }
      }

      // CASE B: Entire Surah Repeat ("miso 1 ta surani 10 marta deb belgilasa qayta-qayta 10 marta o'qiydi")
      if (repeatType === 'surah') {
        if (currentAyah < meta.count) {
          // Continue to next ayah in surah
          currentAyah++;
          updateActiveAyahDisplay();
          playCurrentAudio();
        } else {
          // Reached the end of the surah!
          surahRepeatsDone++;
          updateActiveAyahDisplay();

          if (surahRepeatsDone < repeatTarget) {
            // Restart surah from ayah 1!
            showToast(`🔁 ${repeatTarget} martadan ${surahRepeatsDone}-takror tugadi. Qayta boshlanmoqda...`);
            currentAyah = 1;
            updateActiveAyahDisplay();
            setTimeout(() => playCurrentAudio(), 1200);
          } else {
            // Finished all repetitions!
            isPlaying = false;
            document.getElementById('btnAudioPlay').textContent = '▶';
            showToast(`✅ Barakalloh! Surani ${repeatTarget} marta takrorlash to'liq yakunlandi!`);
            surahRepeatsDone = 0;
            currentAyah = 1;
            updateActiveAyahDisplay();
          }
        }
      }
    };

    // ── REPEAT CONTROLS CONFIG ──
    function setRepeatType(type) {
      repeatType = type;
      surahRepeatsDone = 0;
      ayahRepeatsDone = 0;
      document.getElementById('btnTypeSurah').classList.toggle('active', type === 'surah');
      document.getElementById('btnTypeAyah').classList.toggle('active', type === 'ayah');
      document.getElementById('lblRepeatModeTitle').textContent = type === 'surah' ? 'Surani takrorlash' : 'Oyatma-oyat takrorlash';
      updateActiveAyahDisplay();
    }

    function setRepeatCount(count) {
      repeatTarget = count;
      surahRepeatsDone = 0;
      ayahRepeatsDone = 0;
      document.querySelectorAll('.btn-rep-val').forEach(b => {
        b.classList.toggle('active', b.textContent.includes(count === 999 ? '∞' : count));
      });
      showToast(`Takrorlash soni: ${count === 999 ? 'Cheksiz' : count + ' marta'}`);
      updateActiveAyahDisplay();
    }

    // ── RECITERS & SPEED & THEME ──
    function cycleQori() {
      currentQoriIdx = (currentQoriIdx + 1) % QORIS.length;
      const q = QORIS[currentQoriIdx];
      document.getElementById('lblQoriName').textContent = q.name;
      showToast(`Qori: ${q.name}`);
      if (isPlaying) playCurrentAudio();
    }

    function cycleSpeed() {
      const speeds = [0.8, 1.0, 1.25];
      const idx = speeds.indexOf(currentSpeed);
      currentSpeed = speeds[(idx + 1) % speeds.length];
      document.getElementById('btnSpeed').textContent = `${currentSpeed}x`;
      audioPlayer.playbackRate = currentSpeed;
      showToast(`Tezlik: ${currentSpeed}x`);
    }

    function toggleUzbekTranslation() {
      showUzbekTranslation = !showUzbekTranslation;
      document.getElementById('btnToggleUzbek').classList.toggle('active', showUzbekTranslation);
      document.querySelectorAll('.ayah-uz-translation').forEach(el => {
        el.style.display = showUzbekTranslation ? 'block' : 'none';
      });
      document.getElementById('lblFocusUzbek').style.display = showUzbekTranslation ? 'block' : 'none';
      showToast(showUzbekTranslation ? "Tarjima yoqildi" : "Tarjima yashirildi");
    }

    function adjustFontSize(delta) {
      arFontSize = Math.max(18, Math.min(42, arFontSize + delta));
      document.documentElement.style.setProperty('--ar-font-size', `${arFontSize}px`);
      showToast(`Yozuv hajmi: ${arFontSize}px`);
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }

    function switchViewMode(mode) {
      currentViewMode = mode;
      document.querySelectorAll('.view-mode-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));

      if (mode === 'mushaf') {
        document.getElementById('btnModeMushaf').classList.add('active');
        document.getElementById('pane-mushaf').classList.add('active');
      } else if (mode === 'tajweed') {
        document.getElementById('btnModeTajweed').classList.add('active');
        document.getElementById('pane-tajweed').classList.add('active');
      } else if (mode === 'repeat') {
        document.getElementById('btnModeRepeat').classList.add('active');
        document.getElementById('pane-repeat').classList.add('active');
      }
      updateActiveAyahDisplay();
    }

    // ── SURAH & PORA PICKER MODAL ──
    let activeModalTab = 'suralar';

    function openSurahPicker() {
      const modal = document.getElementById('surahPickerModal');
      modal.style.display = 'flex';
      renderModalSurahs();
      renderModalPoras();
    }

    function closeSurahPicker() {
      document.getElementById('surahPickerModal').style.display = 'none';
    }

    function switchModalTab(tab) {
      activeModalTab = tab;
      document.getElementById('btnTabSuralar').classList.toggle('active', tab === 'suralar');
      document.getElementById('btnTabPoralar').classList.toggle('active', tab === 'poralar');
      document.getElementById('searchWrap').style.display = tab === 'suralar' ? 'block' : 'none';
      document.getElementById('modalSurahList').style.display = tab === 'suralar' ? 'flex' : 'none';
      document.getElementById('modalPoraGrid').style.display = tab === 'poralar' ? 'grid' : 'none';
    }

    function renderModalSurahs(filter = "") {
      const list = document.getElementById('modalSurahList');
      list.innerHTML = '';
      const f = filter.toLowerCase().trim();

      SURAHS_META.forEach(s => {
        if (f && !s.name.toLowerCase().includes(f) && !String(s.num).includes(f) && !s.ar.includes(f)) {
          return;
        }

        const item = document.createElement('div');
        item.className = 'sm-item';
        item.onclick = () => selectSurahFromModal(s.num);

        item.innerHTML = `
          <div class="sm-item-left">
            <div class="sm-num">${s.num}</div>
            <div>
              <div class="sm-name">${s.name}</div>
              <div class="sm-sub">${s.type} · ${s.count} oyat · ${s.juz}-Pora</div>
            </div>
          </div>
          <div class="sm-ar">${s.ar}</div>
        `;
        list.appendChild(item);
      });
    }

    function filterSurahs() {
      const q = document.getElementById('searchSurahInput').value;
      renderModalSurahs(q);
    }

    function renderModalPoras() {
      const grid = document.getElementById('modalPoraGrid');
      grid.innerHTML = '';

      PORAS_META.forEach(p => {
        const card = document.createElement('div');
        card.className = 'pora-card';
        card.onclick = () => selectPoraFromModal(p.pora, p.startSurah, p.startAyah);

        card.innerHTML = `
          <div class="pora-card-num">${p.title}</div>
          <div class="pora-card-desc">${p.desc}</div>
        `;
        grid.appendChild(card);
      });
    }

    function selectSurahFromModal(surahNum) {
      closeSurahPicker();
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        document.getElementById('btnAudioPlay').textContent = '▶';
      }
      currentSurah = surahNum;
      currentAyah = 1;
      surahRepeatsDone = 0;
      ayahRepeatsDone = 0;
      renderSurah();
    }

    function selectPoraFromModal(poraNum, startSurah, startAyah) {
      closeSurahPicker();
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        document.getElementById('btnAudioPlay').textContent = '▶';
      }
      currentSurah = startSurah;
      currentAyah = startAyah;
      surahRepeatsDone = 0;
      ayahRepeatsDone = 0;
      showToast(`${poraNum}-Pora ochildi`);
      renderSurah();
    }

    function exitQuron() {
      if (window.Android && window.Android.closeTv) {
        window.Android.closeTv();
      } else {
        window.history.back();
      }
    }

    // ── INITIALIZATION ──
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlSura = parseInt(params.get('sura') || params.get('surah'));
        const urlOyat = parseInt(params.get('oyat') || params.get('ayah'));
        if (urlSura && urlSura >= 1 && urlSura <= 114) {
          currentSurah = urlSura;
        }
        if (urlOyat && urlOyat >= 1) {
          currentAyah = urlOyat;
        }
      } catch (e) {}

      renderSurah();
    });
  </script>
</body>
</html>
