<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JARVIS Qur'on AI — Barcha Suralar, 30 Pora & Takrorlash</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #040812;
      --card-bg: rgba(10, 22, 36, 0.92);
      --card-border: rgba(0, 229, 255, 0.18);
      --primary-green: #00E676;
      --primary-cyan: #00E5FF;
      --primary-light: rgba(0, 230, 118, 0.12);
      --accent-gold: #F59E0B;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --mushaf-paper: #081422;
      --mushaf-border: #D4AF37;
      --mushaf-text: #F8FAFC;
      --active-glow: rgba(0, 230, 118, 0.35);
      --ar-font-size: 26px;
    }

    body.light-mode {
      --bg-page: #F6F9F8;
      --card-bg: #FFFFFF;
      --card-border: rgba(18, 165, 80, 0.18);
      --primary-green: #12A550;
      --primary-cyan: #0284C7;
      --primary-light: rgba(18, 165, 80, 0.1);
      --accent-gold: #D97706;
      --text-main: #0B2A18;
      --text-muted: #64748B;
      --mushaf-paper: #FFFDF7;
      --mushaf-border: #C5A059;
      --mushaf-text: #1C1917;
      --active-glow: rgba(18, 165, 80, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .quron-app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 80px 16px;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      background: var(--bg-page);
      z-index: 100;
    }
    .btn-header-back {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-header-back:active { transform: scale(0.95); }

    .surah-title-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      background: var(--card-bg);
      border: 1.5px solid var(--primary-green);
      padding: 6px 14px;
      border-radius: 18px;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.15);
      flex: 1;
      max-width: 280px;
    }
    .surah-title-pill:active { transform: scale(0.97); }
    .stp-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stp-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-header-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
    }

    /* ── VIEW MODES SWITCHER ── */
    .view-modes-bar {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 4px;
      margin-top: 10px;
      gap: 4px;
    }
    .view-mode-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .view-mode-btn.active {
      background: var(--primary-green);
      color: #040812;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.35);
    }

    /* ── TAKRORLASH (REPEAT) HERO PANEL ── */
    .repeat-hero-card {
      background: var(--card-bg);
      border: 1.5px solid var(--primary-green);
      border-radius: 18px;
      padding: 14px 16px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 230, 118, 0.12);
    }
    .repeat-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .repeat-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .repeat-type-toggle {
      display: flex;
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2px;
      gap: 2px;
    }
    .btn-rep-type {
      padding: 4px 10px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-rep-type.active {
      background: var(--primary-green);
      color: #040812;
    }

    .repeat-counts-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .btn-rep-val {
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 12px;
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-rep-val.active {
      background: var(--primary-green);
      color: #040812;
      border-color: var(--primary-green);
      box-shadow: 0 2px 8px rgba(0, 230, 118, 0.4);
    }
    .btn-rep-val:active { transform: scale(0.95); }

    .repeat-status-banner {
      background: rgba(0, 230, 118, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-green);
    }

    /* ── AUDIO PLAYER CONTROLS (ALWAYS PROMINENT) ── */
    .audio-player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px 14px;
      margin-top: 10px;
    }
    .qori-select-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      border: 1px solid var(--primary-green);
      color: var(--primary-green);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .audio-center-ctrls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-audio-nav {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }
    .btn-audio-play {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-green);
      border: none;
      color: #040812;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.45);
      font-weight: 900;
    }
    .btn-audio-play:active { transform: scale(0.92); }

    .player-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-player-pill {
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-player-pill.active {
      color: var(--primary-green);
      border-color: var(--primary-green);
    }

    /* Tajweed Legend */
    .tajweed-legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .tg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .tg-dot.green { background: #10B981; }
    .tg-dot.blue { background: #0284C7; }
    .tg-dot.red { background: #EF4444; }

    /* Tajweed Spans in Arabic */
    .tg { color: #10B981 !important; font-weight: 800; } /* G'unna / Ixfo */
    .tb { color: #0284C7 !important; font-weight: 800; } /* Qalqala */
    .tr { color: #EF4444 !important; font-weight: 800; } /* Madd */

    /* ── VIEW 1: KITOBLI (MUSHAF FLOW) ── */
    .view-pane {
      display: none;
      margin-top: 12px;
    }
    .view-pane.active {
      display: block;
    }

    .mushaf-book-page {
      background: var(--mushaf-paper);
      border: 3px double var(--mushaf-border);
      border-radius: 18px;
      padding: 22px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .mushaf-ornament-header {
      text-align: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1.5px solid var(--mushaf-border);
      font-family: 'Amiri', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--mushaf-border);
    }
    .mushaf-bismillah {
      text-align: center;
      font-family: 'Amiri', serif;
      font-size: 22px;
      color: var(--mushaf-border);
      margin-bottom: 16px;
    }
    .mushaf-flow-text {
      font-family: 'Amiri', 'Scheherazade New', serif;
      font-size: var(--ar-font-size);
      line-height: 2.3;
      direction: rtl;
      text-align: justify;
      text-align-last: center;
      color: var(--mushaf-text);
      word-spacing: 4px;
    }
    .m-ayah-span {
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 4px;
      transition: background 0.2s, color 0.2s;
    }
    .m-ayah-span.active {
      background: var(--active-glow);
      color: var(--primary-green);
      font-weight: bold;
    }
    .m-ayah-end {
      display: inline-block;
      margin: 0 5px;
      color: var(--mushaf-border);
      font-size: 18px;
      font-weight: 800;
    }

    /* ── VIEW 2: TAJVIDLI & TARJIMA KARTALARI ── */
    .ayahs-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ayah-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ayah-card.active-reading {
      border-color: var(--primary-green);
      background: var(--primary-light);
      box-shadow: 0 4px 18px var(--active-glow);
    }
    .ayah-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ayah-num-badge {
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      color: var(--primary-green);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .btn-ayah-play-mini {
      background: var(--primary-light);
      border: 1px solid var(--primary-green);
      color: var(--primary-green);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }
    .ayah-ar-text {
      font-family: 'Amiri', 'Scheherazade New', serif;
      font-size: var(--ar-font-size);
      line-height: 1.9;
      direction: rtl;
      text-align: right;
      color: var(--text-main);
      font-weight: 700;
    }
    .ayah-uz-translation {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-muted);
      border-top: 1px dashed var(--card-border);
      padding-top: 8px;
    }

    /* ── VIEW 3: TAKRORLASH (YODLASH MARKAZI) ── */
    .focus-memorize-card {
      background: var(--card-bg);
      border: 2px solid var(--primary-green);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 230, 118, 0.2);
    }
    .focus-badge {
      align-self: center;
      background: var(--primary-light);
      color: var(--primary-green);
      border: 1px solid var(--primary-green);
      padding: 4px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
    }
    .focus-ar-text {
      font-family: 'Amiri', 'Scheherazade New', serif;
      font-size: 32px;
      line-height: 2.1;
      direction: rtl;
      color: var(--text-main);
      font-weight: 700;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .focus-uz-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
      border-top: 1px dashed var(--card-border);
      padding-top: 12px;
    }

    /* ── MODALS (SURAHS & PORAS PICKER) ── */
    .surah-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .surah-modal-content {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sm-header {
      padding: 16px 18px 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .sm-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }
    .btn-sm-close {
      background: transparent;
      border: none;
      font-size: 22px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .sm-tabs-row {
      display: flex;
      padding: 10px 18px 4px 18px;
      gap: 8px;
    }
    .btn-sm-tab {
      flex: 1;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--bg-page);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-sm-tab.active {
      background: var(--primary-green);
      color: #040812;
      border-color: var(--primary-green);
    }

    .sm-search-wrap {
      padding: 8px 18px;
    }
    .sm-search-input {
      width: 100%;
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 13.5px;
      font-family: inherit;
    }
    .sm-search-input:focus {
      outline: none;
      border-color: var(--primary-green);
    }

    .sm-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 18px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sm-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .sm-item:active {
      transform: scale(0.98);
      border-color: var(--primary-green);
    }
    .sm-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sm-num {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary-green);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sm-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
    }
    .sm-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .sm-ar {
      font-family: 'Amiri', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-green);
    }

    /* Pora Grid in Modal */
    .pora-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 8px 18px 24px 18px;
      overflow-y: auto;
      max-height: 60vh;
    }
    .pora-card {
      background: var(--bg-page);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pora-card:active {
      transform: scale(0.97);
      border-color: var(--primary-green);
    }
    .pora-card-num {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary-green);
    }
    .pora-card-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Loading Spinner */
    .loading-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 10px;
      color: var(--primary-green);
      font-weight: 700;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 230, 118, 0.2);
      border-top-color: var(--primary-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast Notification */
    .q-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card-bg);
      border: 1.5px solid var(--primary-green);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      z-index: 3000;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
      white-space: nowrap;
    }
    .q-toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="quron-app">
    
    <!-- 1. HEADER -->
    <header class="q-header">
      <button class="btn-header-back" onclick="exitQuron()">
        <span>‹ Chiqish</span>
      </button>

      <div class="surah-title-pill" onclick="openSurahPicker()">
        <div class="stp-name" id="lblSurahName">
          <span>📖 1. Al-Fotiha</span> <span>▼</span>
        </div>
        <div class="stp-meta" id="lblSurahMeta">Makkiy · 7 oyat · 1-Pora</div>
      </div>

      <div class="header-actions">
        <button class="btn-header-icon" onclick="adjustFontSize(-2)" title="Kichraytirish">A-</button>
        <button class="btn-header-icon" onclick="adjustFontSize(2)" title="Kattalashtirish">A+</button>
        <button class="btn-header-icon" onclick="toggleTheme()" title="Mavzu">🌙</button>
      </div>
    </header>

    <!-- 2. VIEW MODES SWITCHER -->
    <div class="view-modes-bar">
      <button class="view-mode-btn active" id="btnModeMushaf" onclick="switchViewMode('mushaf')">
        <span>📖</span> <span>Kitobli</span>
      </button>
      <button class="view-mode-btn" id="btnModeTajweed" onclick="switchViewMode('tajweed')">

    const BUNDLED_SURAHS = {"1": [{"a": 1, "g": 1, "ar": "﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "uz": "Меҳрибон ва раҳмли Аллоҳнинг номи билан бошлайман. (Аллоҳ таоло ўз китобини \"бисмиллаҳ\" билан бошлагани мусулмонларга ҳам ўрнак, улар ҳам доим ўз сўзларини ва ишларини \"бисмиллаҳ\" билан бошламоқлари лозим. Пайғамбар алайҳиссалом ҳадисларидан бирида: \"Эътиборли ҳар бир иш \"бисмиллаҳ\" билан бошланмас экан, унинг охири кесикдир\", деганлар. Яъни, баракаси бўлмайди, охирига етмайди.)"}, {"a": 2, "g": 2, "ar": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ", "uz": "Барча мақтов, шукрлар оламларнинг тарбиячиси Аллоҳга бўлсин. (Оламларни яратгани учун ҳам, уларнинг тарбиячиси бўлгани учун ҳам, улардаги барча жонзотларга ҳаёт, ризқи рўз бергани учун ҳам Аллоҳ барча ҳамду саноларга сазовордир.)"}, {"a": 3, "g": 3, "ar": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "uz": "У Роҳман ва Раҳийм... (Барчага-кофирга ҳам, мўъминга ҳам меҳрибон ва неъмат берувчи. \"Роҳман\" сифати фақат Аллоҳга хос бўлиб, ундан бошқа ҳеч кимга нисбатан бу сифатни ишлатиб бўлмайди. \"Раҳийм\" сифати, хосроқ бўлиб, фақат мўъминларга қиёмат куни раҳм қилувчи маъносини англатади ва Аллоҳдан ўзгаларга, жумладан, Пайғамбар алайҳиссаломга нисбатан ҳам ишлатилади.)"}, {"a": 4, "g": 4, "ar": "مَٰلِكِ يَوْمِ ٱلدِّينِ", "uz": "У қиёмат кунининг подшоҳи, эгаси. (\"Дин\" сўзи арабчада ҳисоб, жазо, мукофот маъноларини билдиради. \"Явмид дин\"-қиёмат кунида бандалар қайта тирилтирилиб ҳисоб-китоб қилинади. Яхшига мукофот, ёмонга жазо берилади. Бу оятни ўқиганда қиёматни эслаб, ўша даҳшатли кунда фақат Аллоҳнинг ўзи ҳукм чиқаришини, ўша ерда уялиб қолмасликни эслаб, унга тайёргарлик кўришга аҳд қилинади.)"}, {"a": 5, "g": 5, "ar": "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", "uz": "Фақат сенгагина ибодат қиламиз ва фақат сендангина ёрдам сўраймиз. ( \"Иййака наъбуду\" \"фақат сенинг айтганингни қиламиз\" маъносини англатади. Бу эса, банда тарафидан Аллоҳга берилган улкан ваъда. Аллоҳ таоло барчамизни ушбу ваъданинг устидан чиқадиганлардан қилсин. \"Иййака настаъин\" ҳам, фақат Аллоҳдангина ёрдам сўраш маъносини англатади.)"}, {"a": 6, "g": 6, "ar": "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "uz": "Бизни тўғри йўлга бошлагин. (\"Ҳидоятга бошлаш\" луғатда бирор нарсага лутф билан йўллаб қўйишга айтилади.)"}, {"a": 7, "g": 7, "ar": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ", "uz": "Ўзинг неъмат берганларнинг йўлига (бошлагин), ғазабга дучор бўлганларнинг йўлига эмас, адашганларникига ҳам эмас. (\"Неъмат берилганлар\"дан мурод-Пайғамбарлар, сиддиқлар, шаҳидлар ва солиҳ бандалар. \"Ғазабга дучор бўлганлар\"дан мурод-яҳудийлар. Яҳудийларнинг ғазабга дучор бўлишларининг сабаблари кўп, жумладан, анбиёларни ўлдиришлари, Аллоҳга берган аҳдларига вафо қилмасликлари ва ҳоказо. Лекин катта сабаб-билганига амал қилмаслик. Аллоҳ уларга илм берган, улар эса била туриб илмга амал қилмаганлар. \"Адашганлар\"дан мурод-насронийлар. Насороларнинг \"адашганлар\" бўлиши ҳам бир қанча сабабларга кўрадир. Энг асосийси-улар мақсадга эришиш йўлида Аллоҳ кўрсатган йўлни эмас, ўзлари топган йўлни танлаганлар. Демак, оятнинг маъноси: Эй Аллоҳ, бизни ўтган анбиёю авлиё, азизларнинг йўлидан бошлагин, яҳудий ва насронийлар йўлидан бошламагин, деганидир. Имоми Насаий машҳур саҳобий Абу Ҳурайрадан ривоят қилган ҳадиси қудсийда Аллоҳ таоло айтади: \"Намозни ўзим билан бандам орасида иккига бўлганман, бандамга нима сўраса, бераман. Агар у (банда) \"Алҳамду лиллаҳи роббил ъаламийн\" деса, Аллоҳ, бандам менга ҳамд-шукр айтди, дейди. Банда: \"ар-Роҳманир Роҳийм\", деса. Аллоҳ: \"Бандам менга сано-мақтов айтди\", дейди. Банда: \"Малики явмиддин\", деса, Аллоҳ: \"Бандам мени улуғлади\", дейди. Банда: \"Иййака наъбуду ва иййака настаъин\", деса, Аллоҳ: \"Бу мен билан бандам орасидаги аҳд, бандамга нима сўраса, бераман\", дейди. Агар банда: \"Иҳдинас сиротал мустақим, сиротоллазийна анъамта ъалайҳим ғойрил мағзуби алайҳим валаззооллийн\", деса, Аллоҳ: \"Бу бандамга хос, бандамга сўраганини бердим\", дейди.)"}], "36": [{"a": 1, "g": 3706, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يسٓ", "uz": "Йасин."}, {"a": 2, "g": 3707, "ar": "وَٱلْقُرْءَانِ ٱلْحَكِيمِ", "uz": "Қуръони Ҳаким ила қасам."}, {"a": 3, "g": 3708, "ar": "إِنَّكَ لَمِنَ ٱلْمُرْسَلِينَ", "uz": "Албатта, сен Пайғамбарлардандирсан."}, {"a": 4, "g": 3709, "ar": "عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "uz": "Сироти мустақиймдасан."}, {"a": 5, "g": 3710, "ar": "تَنزِيلَ ٱلْعَزِيزِ ٱلرَّحِيمِ", "uz": "Бу Азизу Раҳимнинг нозил қилганидир."}, {"a": 6, "g": 3711, "ar": "لِتُنذِرَ قَوْمًۭا مَّآ أُنذِرَ ءَابَآؤُهُمْ فَهُمْ غَٰفِلُونَ", "uz": "Ота-боболари огоҳлантирилмаган, ўзлари эса, ғофил бўлган қавмларни огоҳлантиришинг учун."}, {"a": 7, "g": 3712, "ar": "لَقَدْ حَقَّ ٱلْقَوْلُ عَلَىٰٓ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ", "uz": "Батаҳқиқ, уларнинг кўпларига (азоб) сўз ҳақ бўлди. Бас, улар иймон келтирмаслар."}, {"a": 8, "g": 3713, "ar": "إِنَّا جَعَلْنَا فِىٓ أَعْنَٰقِهِمْ أَغْلَٰلًۭا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ", "uz": "Биз уларнинг бўйинларига кишанлар солдик. Улар иякларигача етади. Бас, улар кўзлари юмуқ, осмонга қараб ғўдайиб қолдилар. (Ғофилликлари сабабли азоб сўзи ҳақ бўлган кофирларнинг ҳоли ҳам худди шундай, уларнинг иймонга келишига умид йўқ.)"}, {"a": 9, "g": 3714, "ar": "وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سَدًّۭا وَمِنْ خَلْفِهِمْ سَدًّۭا فَأَغْشَيْنَٰهُمْ فَهُمْ لَا يُبْصِرُونَ", "uz": "Ва Биз уларнинг олдиларидан ҳам тўсиқ қилдик, орқаларидан ҳам тўсиқ қилдик, кўзларига парда тортдик. Бас, улар кўрмаслар. ( Бўйнига қўлини қўшиб, кишанланган, кўзи юмуқ ҳолда осмонга қаратиб, ғўдайтириб қўйилган одамнинг бирор нарсани кўрмаслиги учун олдидан ҳам, ортидан ҳам тўсиқ қўйилган. Камига, яна кўзига ҳам парда қўйилган. Шундай ҳолатдаги одамнинг бирор нарсани кўра олишига умид бўлмаганидек, ҳалиги кофирларнинг ҳам иймонга келишидан умид йўқ.)"}, {"a": 10, "g": 3715, "ar": "وَسَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ", "uz": "Уларни огоҳлантирсанг ҳам, огоҳлантирмасанг ҳам, улар учун барибир, иймонга келмаслар."}, {"a": 11, "g": 3716, "ar": "إِنَّمَا تُنذِرُ مَنِ ٱتَّبَعَ ٱلذِّكْرَ وَخَشِىَ ٱلرَّحْمَٰنَ بِٱلْغَيْبِ ۖ فَبَشِّرْهُ بِمَغْفِرَةٍۢ وَأَجْرٍۢ كَرِيمٍ", "uz": "Сен эса, фақат зикр-эслатмага эргашган ва Роҳмандан ғойибона қўрққан кимсани огоҳлантирасан. Бас, унга мағфират ва гўзал ажрнинг хушхабарини бер."}, {"a": 12, "g": 3717, "ar": "إِنَّا نَحْنُ نُحْىِ ٱلْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا۟ وَءَاثَٰرَهُمْ ۚ وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ فِىٓ إِمَامٍۢ مُّبِينٍۢ", "uz": "Албатта, Биз, Ўзимиз ўликларни тирилтирурмиз ва улар тақдим қилган нарсаларни ва қолдирган асарларни ёзурмиз. Ҳар бир нарсанинг ҳисобини очиқ-ойдин имомда олиб қўйганмиз. ( Аллоҳ таоло ўлганлар, тирилишлари ва қилган амаллари учун жавоб беришларини, хабар бермоқда.)"}, {"a": 13, "g": 3718, "ar": "وَٱضْرِبْ لَهُم مَّثَلًا أَصْحَٰبَ ٱلْقَرْيَةِ إِذْ جَآءَهَا ٱلْمُرْسَلُونَ", "uz": "Сен уларга Пайғамбарлар шаҳар аҳолисига келган пайтни мисол қилиб келтир. (Бу шаҳар қайси шаҳар экани, қайси Пайғамбарлар келгани ҳақида Қуръони Каримда ва саҳиҳ ҳадисларда очиқ-ойдин маълумотлар йўқ. Демак, бу оятни шу ҳолича қабул қилган маъқул.)"}, {"a": 14, "g": 3719, "ar": "إِذْ أَرْسَلْنَآ إِلَيْهِمُ ٱثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍۢ فَقَالُوٓا۟ إِنَّآ إِلَيْكُم مُّرْسَلُونَ", "uz": "Ўшанда Биз уларга иккитани юборган эдик, улар икковларини ёлғончига чиқардилар. Бас, Биз учинчи билан қувватладик. Шунда: «Албатта, биз сизларга юборилган Пайғамбарлармиз», дедилар."}, {"a": 15, "g": 3720, "ar": "قَالُوا۟ مَآ أَنتُمْ إِلَّا بَشَرٌۭ مِّثْلُنَا وَمَآ أَنزَلَ ٱلرَّحْمَٰنُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا تَكْذِبُونَ", "uz": "Улар: «Сиз бизга ўхшаган башардан бошқа нарса эмассиз. Роҳман ҳеч нарса нозил қилгани йўқ. Сизлар фақат ёлғон сўзламоқдасиз, холос», дедилар."}, {"a": 16, "g": 3721, "ar": "قَالُوا۟ رَبُّنَا يَعْلَمُ إِنَّآ إِلَيْكُمْ لَمُرْسَلُونَ", "uz": "Улар: «Роббимиз билади. Албатта, биз сизларга юборилган Пайғамбарлармиз."}, {"a": 17, "g": 3722, "ar": "وَمَا عَلَيْنَآ إِلَّا ٱلْبَلَٰغُ ٱلْمُبِينُ", "uz": "Бизнинг зиммамизда очиқ-ойдан етказишдан бошқа нарса йўқ», дедилар."}, {"a": 18, "g": 3723, "ar": "قَالُوٓا۟ إِنَّا تَطَيَّرْنَا بِكُمْ ۖ لَئِن لَّمْ تَنتَهُوا۟ لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ أَلِيمٌۭ", "uz": "Улар: «Биз сизлардан бадгумон бўлдик. Агар тўхтамасангиз, албатта, сизни тошбўрон қиламиз ва сизга биздан аламли азоб етади», дедилар."}, {"a": 19, "g": 3724, "ar": "قَالُوا۟ طَٰٓئِرُكُم مَّعَكُمْ ۚ أَئِن ذُكِّرْتُم ۚ بَلْ أَنتُمْ قَوْمٌۭ مُّسْرِفُونَ", "uz": "Улар: «Бадгумонлигингиз ўзингиз билан. Сизга эслатма берилганигами?! Йўқ! Сиз ўзингиз исрофчи қавмсиз», дедилар."}, {"a": 20, "g": 3725, "ar": "وَجَآءَ مِنْ أَقْصَا ٱلْمَدِينَةِ رَجُلٌۭ يَسْعَىٰ قَالَ يَٰقَوْمِ ٱتَّبِعُوا۟ ٱلْمُرْسَلِينَ", "uz": "Шаҳар четидан бир киши шошилиб келиб: «Эй қавмим, юборилган Пайғамбарларга эргашинг!"}, {"a": 21, "g": 3726, "ar": "ٱتَّبِعُوا۟ مَن لَّا يَسْـَٔلُكُمْ أَجْرًۭا وَهُم مُّهْتَدُونَ", "uz": "Сиздан ажр-ҳақ сўрамайдиган, ўзлари ҳидоятда бўлган шахсларга эргашинг! (Бу Пайғамбарлар даъватлари учун сиздан ажр-ҳақ сўрамайдилар. Шунинг ўзи ҳам уларнинг ҳақлигига далилдир. Агар даъват туфайли бирор нарсага эришмоқ ниятлари бўлганида, сиздан, албатта, ажр-ҳақ сўрар эдилар.)"}, {"a": 22, "g": 3727, "ar": "وَمَا لِىَ لَآ أَعْبُدُ ٱلَّذِى فَطَرَنِى وَإِلَيْهِ تُرْجَعُونَ", "uz": "Менга нима бўлибдики, ўзимни яратган зотга ибодат қилмайин?! Унгагина қайтарилурсизлар."}, {"a": 23, "g": 3728, "ar": "ءَأَتَّخِذُ مِن دُونِهِۦٓ ءَالِهَةً إِن يُرِدْنِ ٱلرَّحْمَٰنُ بِضُرٍّۢ لَّا تُغْنِ عَنِّى شَفَٰعَتُهُمْ شَيْـًۭٔا وَلَا يُنقِذُونِ", "uz": "Мен уни қўйиб, бошқа илоҳлар тутайми?! Агар Роҳман менга бирор зарарни ирода қилса, уларнинг шафоати менга ҳеч фойда бермас ва улар мени қутқара олмаслар."}, {"a": 24, "g": 3729, "ar": "إِنِّىٓ إِذًۭا لَّفِى ضَلَٰلٍۢ مُّبِينٍ", "uz": "Албатта, у тақдирда мен очиқ-ойдин адашувда бўламан."}, {"a": 25, "g": 3730, "ar": "إِنِّىٓ ءَامَنتُ بِرَبِّكُمْ فَٱسْمَعُونِ", "uz": "Албатта, мен Роббингизга иймон келтирдим. Бас, мени тинглангиз», деди. (Эшитиб, билиб қўйинг, мен сизнинг ва ўзимнинг Роббим бўлмиш Аллоҳга иймон келтирдим!)"}, {"a": 26, "g": 3731, "ar": "قِيلَ ٱدْخُلِ ٱلْجَنَّةَ ۖ قَالَ يَٰلَيْتَ قَوْمِى يَعْلَمُونَ", "uz": "«Жаннатга кир», дейилди. У: «Кошки қавмим билсалар эди."}, {"a": 27, "g": 3732, "ar": "بِمَا غَفَرَ لِى رَبِّى وَجَعَلَنِى مِنَ ٱلْمُكْرَمِينَ", "uz": "Роббим мени мағфират этганини ва икром қилинганлардан қилганини», деди. (Иймони ва ихлоси туфайли Аллоҳ таоло ўз фазли ва карами ила у бандани жаннатга ҳукм қилди. У банда жаннатга кириб, нозу неъматларни ва иззат-икромни кўриши билан қавмини эслади. «Кошки қавмим билсалар эди. Роббим мени мағфират этганини ва икром қилинганлардан қилганини», деди».)"}, {"a": 28, "g": 3733, "ar": "۞ وَمَآ أَنزَلْنَا عَلَىٰ قَوْمِهِۦ مِنۢ بَعْدِهِۦ مِن جُندٍۢ مِّنَ ٱلسَّمَآءِ وَمَا كُنَّا مُنزِلِينَ", "uz": "Биз унинг қавмига ундан кейин осмондан бирор лашкар туширмадик ва туширувчи эмас ҳам эдик."}, {"a": 29, "g": 3734, "ar": "إِن كَانَتْ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ فَإِذَا هُمْ خَٰمِدُونَ", "uz": "Фақат биргина қичқириқдан бошқа нарса бўлмади. Бирдан улар сўниб қолдилар."}, {"a": 30, "g": 3735, "ar": "يَٰحَسْرَةً عَلَى ٱلْعِبَادِ ۚ مَا يَأْتِيهِم مِّن رَّسُولٍ إِلَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ", "uz": "Бандаларга ҳасратлар бўлсин! Ҳар қачон уларга Пайғамбар келса, уни фақат истеҳзо қилар эдилар."}, {"a": 31, "g": 3736, "ar": "أَلَمْ يَرَوْا۟ كَمْ أَهْلَكْنَا قَبْلَهُم مِّنَ ٱلْقُرُونِ أَنَّهُمْ إِلَيْهِمْ لَا يَرْجِعُونَ", "uz": "Ахир улар ўзларидан олдинги қанча асрларни ҳалок этганимизни ва, албатта, ўшалар уларга қайтмасликларини кўрмайдиларми?!"}, {"a": 32, "g": 3737, "ar": "وَإِن كُلٌّۭ لَّمَّا جَمِيعٌۭ لَّدَيْنَا مُحْضَرُونَ", "uz": "Албатта, барчалари тўпланган ҳолларида ҳузуримизга ҳозир қилингайлар."}, {"a": 33, "g": 3738, "ar": "وَءَايَةٌۭ لَّهُمُ ٱلْأَرْضُ ٱلْمَيْتَةُ أَحْيَيْنَٰهَا وَأَخْرَجْنَا مِنْهَا حَبًّۭا فَمِنْهُ يَأْكُلُونَ", "uz": "Улар учун ўлик ер оят-белгидир. Биз уни тирилтирдик ва ундан дон чиқардик. Бас, ундан ерлар."}, {"a": 34, "g": 3739, "ar": "وَجَعَلْنَا فِيهَا جَنَّٰتٍۢ مِّن نَّخِيلٍۢ وَأَعْنَٰبٍۢ وَفَجَّرْنَا فِيهَا مِنَ ٱلْعُيُونِ", "uz": "Ва унда хурмо ва узум боғлари яратдик ҳамда ичидан булоқларни чиқардик."}, {"a": 35, "g": 3740, "ar": "لِيَأْكُلُوا۟ مِن ثَمَرِهِۦ وَمَا عَمِلَتْهُ أَيْدِيهِمْ ۖ أَفَلَا يَشْكُرُونَ", "uz": "Унинг меваларидан ва ўз қўллари қилган нарсалардан ейишлари учун. Шукр қилмайдиларми?!"}, {"a": 36, "g": 3741, "ar": "سُبْحَٰنَ ٱلَّذِى خَلَقَ ٱلْأَزْوَٰجَ كُلَّهَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ وَمِنْ أَنفُسِهِمْ وَمِمَّا لَا يَعْلَمُونَ", "uz": "Ер ўстирадиган нарсалардан, уларнинг ўзларидан ва улар билмайдиган нарсалардан, барчасидан жуфтларни яратган зот пок бўлди. (Ўсимлик дунёсидан саналувчи барча мавжудотлар жуфт қилиб яратилгани илмга яқинда маълум бўлди. Ҳозирги замон илмининг бу кашфиёти Қуръони Каримнинг ҳақиқий илоҳий китоб эканини яна бир бор тасдиқлади.)"}, {"a": 37, "g": 3742, "ar": "وَءَايَةٌۭ لَّهُمُ ٱلَّيْلُ نَسْلَخُ مِنْهُ ٱلنَّهَارَ فَإِذَا هُم مُّظْلِمُونَ", "uz": "Улар учун кечаси ҳам оят-белгидир. Биз уни кундуздан шилиб оламиз. Бас, улар бирдан зулматда қолгувчилардир. (Кечанинг кириш терини шилиб олишга ўхшатилмоқда. Тери аста-аста шилиб олинганидек, кундуз ҳам ундан ажратиб олинади.)"}, {"a": 38, "g": 3743, "ar": "وَٱلشَّمْسُ تَجْرِى لِمُسْتَقَرٍّۢ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ", "uz": "Қуёш ўз истиқрори учун жараён этар. Бу азизу ўта билгувчи зотнинг тақдир қилганидир. (Оятда қуёшнинг ўз истиқрори учун ажратилган маконда ва замонда жараён этиши–ҳаракатланиши ҳақидагина гап кетмоқда.)"}, {"a": 39, "g": 3744, "ar": "وَٱلْقَمَرَ قَدَّرْنَٰهُ مَنَازِلَ حَتَّىٰ عَادَ كَٱلْعُرْجُونِ ٱلْقَدِيمِ", "uz": "Ойни эса, токи эски (хурмо) шингили (ҳолига) қайтгунга қадар манзилларини бичиб қўйганмиз. (Ой ҳам, қуёш ҳам думалоқ шаклдаги самовий жисмдир. Инсоннинг кўзига қуёш доим бир хил суратда кўринади. Лекин ой бир ой давомида йигирма саккиз шаклга киради. Аввал кичик ҳилол бўлиб кўринади. Кундан-кунга катталашиб, тўлин баркашга айланади. Кейин яна аста-секин ҳилол ҳолига қайтади. Чунки Аллоҳ таоло ой учун йигирма саккиз манзилни бичиб қўйган. Ҳар куни ҳар хил манзилдан чиқади, ҳар куни ҳар хил ҳажмда кўринади.)"}, {"a": 40, "g": 3745, "ar": "لَا ٱلشَّمْسُ يَنۢبَغِى لَهَآ أَن تُدْرِكَ ٱلْقَمَرَ وَلَا ٱلَّيْلُ سَابِقُ ٱلنَّهَارِ ۚ وَكُلٌّۭ فِى فَلَكٍۢ يَسْبَحُونَ", "uz": "На қуёшнинг ойга етиб олмоғи дуруст бўлар ва на кеча кундуздан ўзиб кетар. Ҳар бири фалакда сузиб юрар. (Ҳеч қачон қуёш ойга етиб олиб, бемаҳалда бош кўтариб қолиши мумкин эмас. Улардан ҳар бири Аллоҳ белгилаган вақтдагина чиқади. Бу, низом ҳатто дақиқаларигача аниқдир. Ундан кеч ҳам қолмайди, илгари ҳам кетмайди. Бу жараён дунё бунёд бўлганидан буён давом этиб келмоқда. Бирон марта бирон дақиқага ўзгарган эмас. Ушбу жараённи тақдир қилган зот ўликларни қайта тирилтиришга қодир эмасми?!)"}, {"a": 41, "g": 3746, "ar": "وَءَايَةٌۭ لَّهُمْ أَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِى ٱلْفُلْكِ ٱلْمَشْحُونِ", "uz": "Улар учун Биз уларнинг наслларини тўла кемада кўтарганимиз ҳам бир оят-белгидир."}, {"a": 42, "g": 3747, "ar": "وَخَلَقْنَا لَهُم مِّن مِّثْلِهِۦ مَا يَرْكَبُونَ", "uz": "Ва Биз улар учун унга ўхшаш минадиган нарсаларни халқ қилдик."}, {"a": 43, "g": 3748, "ar": "وَإِن نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنقَذُونَ", "uz": "Агар хоҳласак, уларни ғарқ этурмиз. Бас, уларнинг ёрдамчиси бўлмас ва ҳам улар қутқазилмас."}, {"a": 44, "g": 3749, "ar": "إِلَّا رَحْمَةًۭ مِّنَّا وَمَتَٰعًا إِلَىٰ حِينٍۢ", "uz": "Магар Биздан бир раҳмат ва маълум муддатгача баҳраманд бўлиш бўлсагина. (Фақат Аллоҳнинг Ўзи раҳмат назарини солиб, қутқариб қолиши мумкин. Ёки маълум муддатгача дунёнинг матоҳидан баҳраманд қилиш учун омон қолдириши мумкин. Бўлмаса, ҳеч ким эсон қолмас. Бунинг мисоли ҳаётда тез-тез такрорланиб ҳам туради.)"}, {"a": 45, "g": 3750, "ar": "وَإِذَا قِيلَ لَهُمُ ٱتَّقُوا۟ مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ", "uz": "Уларга: «Олдингиздаги нарсадан ва ортингиздаги нарсадан қўрқинг. Шояд раҳм қилинсангиз», дейилса."}, {"a": 46, "g": 3751, "ar": "وَمَا تَأْتِيهِم مِّنْ ءَايَةٍۢ مِّنْ ءَايَٰتِ رَبِّهِمْ إِلَّا كَانُوا۟ عَنْهَا مُعْرِضِينَ", "uz": "Ва уларга Роббилари оятларидан бир оят келганида, фақат ундан юз ўгиргувчи бўлурлар."}, {"a": 47, "g": 3752, "ar": "وَإِذَا قِيلَ لَهُمْ أَنفِقُوا۟ مِمَّا رَزَقَكُمُ ٱللَّهُ قَالَ ٱلَّذِينَ كَفَرُوا۟ لِلَّذِينَ ءَامَنُوٓا۟ أَنُطْعِمُ مَن لَّوْ يَشَآءُ ٱللَّهُ أَطْعَمَهُۥٓ إِنْ أَنتُمْ إِلَّا فِى ضَلَٰلٍۢ مُّبِينٍۢ", "uz": "Уларга: «Аллоҳ сизга ризқ қилиб берган нарсадан инфоқ қилинглар», дейилганда, куфр келтирганлар иймон келтирганларга: «Аллоҳ хоҳласа, ўзи таом берадиган кимсани биз таомлантирамизми?! Сиз очиқ-ойдин залолатдан бошқа нарсада эмассиз», дерлар. (Сиз Аллоҳ ҳаммага ризқ беради, деган залолатли эътиқоддасизлар, мана, биздан баъзи бир одамларга таом беришимизни сўраб туришингиз бунинг далили, демоқчилар. Аслида эса, уларнинг тасаввурлари, гаплари айни залолатдир. Ҳеч қачон, ҳеч қандай инсон ўзига ҳам, бошқага ҳам ризқ топиб бера олмайди. Аллоҳ таоло бировнинг ризқини кенг, бировнинг ризқини тор қилиб қўяди. Ҳаммаси бандаларни синаш учундир. Ҳаммага ризқ берувчи, боқувчи Аллоҳ таолонинг ягона Ўзидир. Мен бировга ризқ беряпман, таомлантиряпман, боқяпман, деган одам кофир бўлади, очиқ-ойдин залолатга кетади.)"}, {"a": 48, "g": 3753, "ar": "وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَٰدِقِينَ", "uz": "Улар: «Агар ростгўй бўлсангиз, бу ваъда қачон бўлур?» дерлар."}, {"a": 49, "g": 3754, "ar": "مَا يَنظُرُونَ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ تَأْخُذُهُمْ وَهُمْ يَخِصِّمُونَ", "uz": "Улар фақат талашиб-тортишиб турганларида ўзларини бирдан оладиган биргина қичқириқдан бошқа нарсани кутаётганлари йўқ."}, {"a": 50, "g": 3755, "ar": "فَلَا يَسْتَطِيعُونَ تَوْصِيَةًۭ وَلَآ إِلَىٰٓ أَهْلِهِمْ يَرْجِعُونَ", "uz": "Улар на васият қилишга қодир бўларлар ва на ўз аҳлларига қайтарлар."}, {"a": 51, "g": 3756, "ar": "وَنُفِخَ فِى ٱلصُّورِ فَإِذَا هُم مِّنَ ٱلْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ", "uz": "Ва сурга пуфланди. Бас, улар бирдан Роббилари томон қабрлардан шошилиб чиқурлар."}, {"a": 52, "g": 3757, "ar": "قَالُوا۟ يَٰوَيْلَنَا مَنۢ بَعَثَنَا مِن مَّرْقَدِنَا ۜ ۗ هَٰذَا مَا وَعَدَ ٱلرَّحْمَٰنُ وَصَدَقَ ٱلْمُرْسَلُونَ", "uz": "Улар: «Воҳ, шўримиз қурисин! Бизни ётган жойимиздан ким қўзғотди?! Бу Роҳман ваъда қилган ва юборилган Пайғамбарлар тасдиқлаган нарса-ку?!» дерлар."}, {"a": 53, "g": 3758, "ar": "إِن كَانَتْ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ فَإِذَا هُمْ جَمِيعٌۭ لَّدَيْنَا مُحْضَرُونَ", "uz": "Фақат биргина қичқириқдан бошқа нарса бўлгани йўқ. Бас, улар бирдан тўпланиб, ҳузуримизда ҳозир қилингандирлар."}, {"a": 54, "g": 3759, "ar": "فَٱلْيَوْمَ لَا تُظْلَمُ نَفْسٌۭ شَيْـًۭٔا وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ", "uz": "Бугунги кунда бирор жонга ҳеч бир зулм қилинмас. Қилиб ўтган амалларингиздан бошқасига жазо ҳам олмассиз."}, {"a": 55, "g": 3760, "ar": "إِنَّ أَصْحَٰبَ ٱلْجَنَّةِ ٱلْيَوْمَ فِى شُغُلٍۢ فَٰكِهُونَ", "uz": "Албатта, жаннат эгалари у кунда завқланувчилик ила машғуллар. ( Нима уларга завқ, шодлик, хурсандчилик берса, ҳаммаси у ерда муҳайёдир.)"}, {"a": 56, "g": 3761, "ar": "هُمْ وَأَزْوَٰجُهُمْ فِى ظِلَٰلٍ عَلَى ٱلْأَرَآئِكِ مُتَّكِـُٔونَ", "uz": "Улар ва уларнинг жуфтлари сояларда сўриларда ёнбошлаб ётурлар."}, {"a": 57, "g": 3762, "ar": "لَهُمْ فِيهَا فَٰكِهَةٌۭ وَلَهُم مَّا يَدَّعُونَ", "uz": "Улар учун у ерда мевалар бордир. Улар учун у ерда истаган нарсалар бордир. (Аҳли жаннатлар нимани истасалар, жаннатда ўша нарса бордир. Кўнгиллари исташи билан олдиларида муҳайё бўлади.)"}, {"a": 58, "g": 3763, "ar": "سَلَٰمٌۭ قَوْلًۭا مِّن رَّبٍّۢ رَّحِيمٍۢ", "uz": "Раҳим бўлган Роббдан «Салом» сўзи бордир. (Шунча нозу неъмат, роҳат-фароғат, шавқу завқнинг устига ўзлари учун ниҳоятда раҳмли бўлган зот Роббилари Аллоҳ таоло томонидан «Салом» ҳам келади.)"}, {"a": 59, "g": 3764, "ar": "وَٱمْتَٰزُوا۟ ٱلْيَوْمَ أَيُّهَا ٱلْمُجْرِمُونَ", "uz": "Эй жиноятчилар! Бугунги кунда сиз ажралингиз!"}, {"a": 60, "g": 3765, "ar": "۞ أَلَمْ أَعْهَدْ إِلَيْكُمْ يَٰبَنِىٓ ءَادَمَ أَن لَّا تَعْبُدُوا۟ ٱلشَّيْطَٰنَ ۖ إِنَّهُۥ لَكُمْ عَدُوٌّۭ مُّبِينٌۭ", "uz": "Мен сизларга: «Эй одам болалари, шайтонга ибодат қилманг, албатта, у сизга очиқ-ойдин душмандир."}, {"a": 61, "g": 3766, "ar": "وَأَنِ ٱعْبُدُونِى ۚ هَٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ", "uz": "Ва Менга ибодат қилинг, мана шу тўғри йўлдир», деб амр қилмаган эдимми?!"}, {"a": 62, "g": 3767, "ar": "وَلَقَدْ أَضَلَّ مِنكُمْ جِبِلًّۭا كَثِيرًا ۖ أَفَلَمْ تَكُونُوا۟ تَعْقِلُونَ", "uz": "Батаҳқиқ, у сизлардан кўпчилик авлодни адаштирди. Ақл юритувчи бўлмаган эдингизми?! (Шайтон сизлардан кўп авлодларни тўғри йўлдан адаштирди, сиз ақл юритмадингизми? У юр деса, орқасидан кетавердингизми?!)"}, {"a": 63, "g": 3768, "ar": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى كُنتُمْ تُوعَدُونَ", "uz": "Мана бу сизга ваъда қилинган жаҳаннамдир!"}, {"a": 64, "g": 3769, "ar": "ٱصْلَوْهَا ٱلْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَ", "uz": "Куфр келтириб ўтганингиз туфайли бугунги кунда унга киринг!"}, {"a": 65, "g": 3770, "ar": "ٱلْيَوْمَ نَخْتِمُ عَلَىٰٓ أَفْوَٰهِهِمْ وَتُكَلِّمُنَآ أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُم بِمَا كَانُوا۟ يَكْسِبُونَ", "uz": "Бугунги кунда уларнинг оғизларига муҳр урамиз. Нима касб қилганларини Бизга қўллари сўзлар ва оёқлари гувоҳлик берур. (Жиноятчиларнинг оғизлари муҳрлаб қўйилади, бошқа аъзолари шоҳидлик бера бошлайди. Қўли гапиради, оёғи гувоҳлик беради.)"}, {"a": 66, "g": 3771, "ar": "وَلَوْ نَشَآءُ لَطَمَسْنَا عَلَىٰٓ أَعْيُنِهِمْ فَٱسْتَبَقُوا۟ ٱلصِّرَٰطَ فَأَنَّىٰ يُبْصِرُونَ", "uz": "Агар хоҳласак, кўзларини теп-текис қилиб қўюрмиз. Бас, улар йўлга шошилурлар. Аммо қандай ҳам кўрсинлар."}, {"a": 67, "g": 3772, "ar": "وَلَوْ نَشَآءُ لَمَسَخْنَٰهُمْ عَلَىٰ مَكَانَتِهِمْ فَمَا ٱسْتَطَٰعُوا۟ مُضِيًّۭا وَلَا يَرْجِعُونَ", "uz": "Агар хоҳласак, уларни жойларида қотириб қўюрмиз. Бас, олдинги юришга ҳам қодир бўлмаслар, ортга ҳам қайта олмаслар."}, {"a": 68, "g": 3773, "ar": "وَمَن نُّعَمِّرْهُ نُنَكِّسْهُ فِى ٱلْخَلْقِ ۖ أَفَلَا يَعْقِلُونَ", "uz": "Кимнинг умрини узоқ қилсак, уни хилқатида ночор қилиб қўюрмиз. Ахир ақл ишлатиб кўрмайдиларми?! (Иймонга келиб, ибодат билан ўтган мўминлар қариганлари сари роҳатлари кўпайиб боради. Ҳаётда қолишни савоб ишлаш учун фурсат деб хурсанд бўладилар. Жаннатга ва Аллоҳнинг розилигига етишиш умидида ўлимни хурсанд бўлиб кутиб оладилар. Кофирлар эса, ақлларини ишлатмаганлари учун бу масалада катта қийинчиликда қоладилар.)"}, {"a": 69, "g": 3774, "ar": "وَمَا عَلَّمْنَٰهُ ٱلشِّعْرَ وَمَا يَنۢبَغِى لَهُۥٓ ۚ إِنْ هُوَ إِلَّا ذِكْرٌۭ وَقُرْءَانٌۭ مُّبِينٌۭ", "uz": "Биз унга шеърни таълим берганимиз йўқ. Ва бу унинг учун тўғри ҳам келмайди. У зикр ва очиқ-ойдин Қуръондан ўзга нарса эмас."}, {"a": 70, "g": 3775, "ar": "لِّيُنذِرَ مَن كَانَ حَيًّۭا وَيَحِقَّ ٱلْقَوْلُ عَلَى ٱلْكَٰفِرِينَ", "uz": "Тирик бўлган шахсларни огоҳлантириш ва кофирларга (азоб) сўзини ҳақ қилиши учундир."}, {"a": 71, "g": 3776, "ar": "أَوَلَمْ يَرَوْا۟ أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَآ أَنْعَٰمًۭا فَهُمْ لَهَا مَٰلِكُونَ", "uz": "Ахир Биз улар учун Ўз қўлларимиз—ла қилган нарсалардан чорваларни яратиб қўйганимизни кўрмайдиларми?! Бас, улар ўшаларга молик–эгадирлар-ку!"}, {"a": 72, "g": 3777, "ar": "وَذَلَّلْنَٰهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَأْكُلُونَ", "uz": "Биз уларга ўша(ҳайвон)ларни бўйинсундириб қўйдик. Бас, улардан маркаблари бор ва улардан ерлар."}, {"a": 73, "g": 3778, "ar": "وَلَهُمْ فِيهَا مَنَٰفِعُ وَمَشَارِبُ ۖ أَفَلَا يَشْكُرُونَ", "uz": "Улар учун ўшаларда манфаатлар ва ичкиликлар бор. Ахир шукр қилмайдиларми?!"}, {"a": 74, "g": 3779, "ar": "وَٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ ءَالِهَةًۭ لَّعَلَّهُمْ يُنصَرُونَ", "uz": "Улар Аллоҳдан ўзга илоҳлар тутдилар. Гўёки улардан ёрдам берилар эмиш."}, {"a": 75, "g": 3780, "ar": "لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٌۭ مُّحْضَرُونَ", "uz": "Уларнинг ёрдамига у(худо)лари қодир бўлмаслар. Улар эса, ўша(худо)лари учун ҳозир қилинган аскардирлар. (Мушрикларнинг «худолари» уларга ёрдам беришга қодир бўла олмайдилар. Лекин улар ўша «худолари» учун жон фидо қилишга тайёр турган аскарлардир. Улар учун турли хизматлар адо этадилар. Сохта худоларини ҳимоя қилиш учун ўзларини ўтга-чўққа урадилар. Булар қандай худолар бўлди?! Булар қандай бандалар бўлди? Бундай худолик ва бандалик қайси мантиққа тўғри келади?)"}, {"a": 76, "g": 3781, "ar": "فَلَا يَحْزُنكَ قَوْلُهُمْ ۘ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ", "uz": "Уларнинг гапи сени хафа қилмасин. Албатта, Биз нимани сир тутсалар ва нимани ошкор қилсалар, билурмиз."}, {"a": 77, "g": 3782, "ar": "أَوَلَمْ يَرَ ٱلْإِنسَٰنُ أَنَّا خَلَقْنَٰهُ مِن نُّطْفَةٍۢ فَإِذَا هُوَ خَصِيمٌۭ مُّبِينٌۭ", "uz": "Инсон Биз уни нутфадан яратганимизни билмасми?! Энди эса, у очиқ-ойдин хусуматчи бўлиб турибди?!"}, {"a": 78, "g": 3783, "ar": "وَضَرَبَ لَنَا مَثَلًۭا وَنَسِىَ خَلْقَهُۥ ۖ قَالَ مَن يُحْىِ ٱلْعِظَٰمَ وَهِىَ رَمِيمٌۭ", "uz": "У Бизга мисол келтирди ва ўз яратилишини унутди. «Суякларни ким тирилтиради? Ҳолбуки, улар титилиб кетган-ку?!» деди."}, {"a": 79, "g": 3784, "ar": "قُلْ يُحْيِيهَا ٱلَّذِىٓ أَنشَأَهَآ أَوَّلَ مَرَّةٍۢ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ", "uz": "Сен: «Уларни илк марта йўқдан бор қилган зот тирилтирур ва у ҳар бир яратилган нарсани яхши билгувчидир», деб айт."}, {"a": 80, "g": 3785, "ar": "ٱلَّذِى جَعَلَ لَكُم مِّنَ ٱلشَّجَرِ ٱلْأَخْضَرِ نَارًۭا فَإِذَآ أَنتُم مِّنْهُ تُوقِدُونَ", "uz": "У зот сизларга яшил дарахтдан олов қилиб бергандир. Энди эса, сиз ундан олов ёқмоқдасиз. (У зот шундай қудратли зотки, баъзи нарсаларни ўзига қарама-қарши томондан ҳам чиқараверади. Мисол учун, ям-яшил дарахтни олайлик. У ҳўл бўлади. Таркибида сув бор. Сув эса, оловни ўчиради. Аммо Аллоҳ таоло оловга терс бўлмиш ҳўл дарахтни бир-бирига ишқаса, ўт чиқарадиган ҳолга келтириб қўйгандир. Оловга ёқилғини ҳам ўша дарахтнинг ўзидан қилиб қўйгандир. Бу улкан бир мўъжизага одамлар эътибор бермайдилар.)"}, {"a": 81, "g": 3786, "ar": "أَوَلَيْسَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِقَٰدِرٍ عَلَىٰٓ أَن يَخْلُقَ مِثْلَهُم ۚ بَلَىٰ وَهُوَ ٱلْخَلَّٰقُ ٱلْعَلِيمُ", "uz": "Осмонлару ерни яратган зот уларга ўхшашни яратишга қодир эмасми?! Йўқ! У ўта яратгувчи, ўта билгувчи зотдир."}, {"a": 82, "g": 3787, "ar": "إِنَّمَآ أَمْرُهُۥٓ إِذَآ أَرَادَ شَيْـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ", "uz": "Қачон бирон нарсани ирода қилса, Унинг иши «Бўл» демоқликдир, холос. Бас, у нарса бўлур."}, {"a": 83, "g": 3788, "ar": "فَسُبْحَٰنَ ٱلَّذِى بِيَدِهِۦ مَلَكُوتُ كُلِّ شَىْءٍۢ وَإِلَيْهِ تُرْجَعُونَ", "uz": "Бас, барча нарсанинг том эгалиги қўлида бўлган зот покдир. Унгагина қайтарилурсизлар. (Гап шундай экан, демак дунёдаги барча нарсаларнинг тўла эгалиги ва тасарруфи қўлида бўлган Аллоҳ таоло покдир. Барча айб ва нуқсонлардан, жумладан, кофир ва мушриклар, ўлганларни қайта тирилтира олмайди, деб тақаётган нуқсондан ҳам покдир.)"}], "67": [{"a": 1, "g": 5242, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ تَبَٰرَكَ ٱلَّذِى بِيَدِهِ ٱلْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ", "uz": "Қўлида мулк бўлган У зот улуғ, муқаддас бўлди. У барча нарсага қодирдир."}, {"a": 2, "g": 5243, "ar": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ", "uz": "У ўлим ва ҳаётини сизларнинг қайсиларингиз амалда яхшироқ эканлигингизни синаш учун яратгандир. У азиз ва ўта мағфиратлидир. (Ўлимни эслаган одам унга тайёргарлик кўради ва ўлгандан сўнг шарманда бўлмаслик учун ўзини яхши ишларга сафарбар қилади.)"}, {"a": 3, "g": 5244, "ar": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ", "uz": "У етти осмонни табақама-табақа яратгандир. Роҳманнинг яратганида ҳеч тафовут кўрмассан. Қайта назар сол! Бирор камчилик кўряпсанми?"}, {"a": 4, "g": 5245, "ar": "ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ ٱلْبَصَرُ خَاسِئًۭا وَهُوَ حَسِيرٌۭ", "uz": "Сўнг такрор-такрор назар сол, назар сенга истаганини топа олмай, ҳорғин- чарчаган ҳолда қайтади."}, {"a": 5, "g": 5246, "ar": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ", "uz": "Ва дарҳақиқат Биз яқин осмонни чироқлар билан зийнатлаб қўйдик ва у (чироқ)ларни шайтонларга отиладиган нарса ҳам қилиб қўйдик. Ва у(шайтон)ларга олови қизиб турган жаҳаннамни тайёрлаб қўйдик. (Араб фолбинлари бизнинг шайтонларимиз осмонга чиқиб, ғойибдаги нарсаларни билиб беради, деб мақтанар эдилар. Қуръони Карим буни рад этиб, бу дунёда шайтонларни юлдузлардан ажраб чиққан учқунлар қувиб ҳайдашини, у дунёда эса, уларга Аллоҳ жаҳаннам азобини тайёрлаб қўйганини таъкидламоқда.)"}, {"a": 6, "g": 5247, "ar": "وَلِلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ عَذَابُ جَهَنَّمَ ۖ وَبِئْسَ ٱلْمَصِيرُ", "uz": "Ўз Роббиларига куфр келтирганлар учун жаҳаннам азоби бордур ва у қандай ҳам ёмон қайтадиган жой!"}, {"a": 7, "g": 5248, "ar": "إِذَآ أُلْقُوا۟ فِيهَا سَمِعُوا۟ لَهَا شَهِيقًۭا وَهِىَ تَفُورُ", "uz": "Улар жаҳаннамга ташланган чоғларида унинг ҳанграган овозини эшитурлар, у эса қайнаб турган бўладир."}, {"a": 8, "g": 5249, "ar": "تَكَادُ تَمَيَّزُ مِنَ ٱلْغَيْظِ ۖ كُلَّمَآ أُلْقِىَ فِيهَا فَوْجٌۭ سَأَلَهُمْ خَزَنَتُهَآ أَلَمْ يَأْتِكُمْ نَذِيرٌۭ", "uz": "У ғазабдан ёрилиб кетай дейдир. Ҳар қачон унга янги гуруҳ ташланганда унинг хизматкорлари: «Сизларга огоҳлантирувчи келмаганмиди?», деб сўрайдир."}, {"a": 9, "g": 5250, "ar": "قَالُوا۟ بَلَىٰ قَدْ جَآءَنَا نَذِيرٌۭ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ ٱللَّهُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا فِى ضَلَٰلٍۢ كَبِيرٍۢ", "uz": "Улар: «Ҳа, дарҳақиқат бизга огоҳлантирувчи келган эди. Лекин биз (уни) ёлғончига чиқардик ва: «Аллоҳ ҳеч нарса туширгани йўқ, сизлар катта адашувдан бошқа ҳеч нарса эмассизлар», деган эдик», дерлар."}, {"a": 10, "g": 5251, "ar": "وَقَالُوا۟ لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِىٓ أَصْحَٰبِ ٱلسَّعِيرِ", "uz": "Ва улар: «Агар эътибор қулоғи билан эшитганимизда ёки ақлни ишлатганимизда эди, дўзахийлар орасида бўлмаган бўлар эдик», дерлар."}, {"a": 11, "g": 5252, "ar": "فَٱعْتَرَفُوا۟ بِذَنۢبِهِمْ فَسُحْقًۭا لِّأَصْحَٰبِ ٱلسَّعِيرِ", "uz": "Бас, улар ўз гуноҳларини эътироф этдилар. Йўқолсин дўзахийлар!"}, {"a": 12, "g": 5253, "ar": "إِنَّ ٱلَّذِينَ يَخْشَوْنَ رَبَّهُم بِٱلْغَيْبِ لَهُم مَّغْفِرَةٌۭ وَأَجْرٌۭ كَبِيرٌۭ", "uz": "Албатта ўз Роббиларидан ғойибдан қўрқадиганлар учун гуноҳларини кечиш ва улкан ажр-савоблар бордир."}, {"a": 13, "g": 5254, "ar": "وَأَسِرُّوا۟ قَوْلَكُمْ أَوِ ٱجْهَرُوا۟ بِهِۦٓ ۖ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ", "uz": "Ва сиз сўзингизни сир тутасизми ёки ошкора айтасизми, албатта, У кўнгиллардагини ҳам билгувчи зотдир."}, {"a": 14, "g": 5255, "ar": "أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلْخَبِيرُ", "uz": "Яратган зот Ўзи билмасмиди? Ва У дақиқларгача билувчи ва хабардор зотдир."}, {"a": 15, "g": 5256, "ar": "هُوَ ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ ذَلُولًۭا فَٱمْشُوا۟ فِى مَنَاكِبِهَا وَكُلُوا۟ مِن رِّزْقِهِۦ ۖ وَإِلَيْهِ ٱلنُّشُورُ", "uz": "У сизларга ерни бўйсундириб қўйган зотдир. Бас, унинг турли жойларида юринг ва Унинг ризқидан енг ва қабрдан чиқиб бориш ҳам Унинг ҳузурига бўладир. (Уламоларимиз қадимдан ушбу ояти кариманинг тафсирини Исломда меҳнатга чорлаш, ризқни териб ейиш, ер юзинининг турли жойларида ҳаракат қилиш зарурлигига далил қилиб келтирадилар. Дарҳақиқаат, Аллоҳ таоло ерни инсонга бўйсундириб қўйган, лекин бу ҳақиқат ҳозирги асримиздагидек ҳеч қачон яққол кўзга ташланмаган.)"}, {"a": 16, "g": 5257, "ar": "ءَأَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يَخْسِفَ بِكُمُ ٱلْأَرْضَ فَإِذَا هِىَ تَمُورُ", "uz": "Осмондаги зот сизларни ерга юттириб юборишидан омонда бўлдингизми? У (ер) эса изтиробда ҳаракатланиб туради. («Осмондаги зот»дан мурод Аллоҳ таоло, лекин бу дегани Аллоҳ осмонда дегани эмас. Чунки Аллоҳ таоло маконга муҳтож эмасдир. У макон ва замондан устун зотдир. Аҳли сунна ва жамоа эътиқодига биноан, Аллоҳнинг ерда ёки осмонда дейилишидан мақсад, Унинг хоҳиши ва ҳукми еру осмонга баробар ўтиши ва Унинг султони ғолиб эканлигидир.)"}, {"a": 17, "g": 5258, "ar": "أَمْ أَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًۭا ۖ فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ", "uz": "Ёки осмондаги зот сизларга азоб шамолни юборишидан омонда бўлдингизми? Бас, албатта огоҳлантириш қандоқ бўлишини билурсизлар."}, {"a": 18, "g": 5259, "ar": "وَلَقَدْ كَذَّبَ ٱلَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ", "uz": "Ва дарҳақиқат улардан аввалгилари ҳам ёлғонга чиқарган эдилар. Бас инкорим қандай бўлди?!"}, {"a": 19, "g": 5260, "ar": "أَوَلَمْ يَرَوْا۟ إِلَى ٱلطَّيْرِ فَوْقَهُمْ صَٰٓفَّٰتٍۢ وَيَقْبِضْنَ ۚ مَا يُمْسِكُهُنَّ إِلَّا ٱلرَّحْمَٰنُ ۚ إِنَّهُۥ بِكُلِّ شَىْءٍۭ بَصِيرٌ", "uz": "Тепаларида (қаноатларини) ёйиб ва йиғаётган қушни кўрмайдиларми? Уларни Роҳмандан бошқа ушлаб турувчи йўқ. Албатта, У барча нарсани кўрувчидир."}, {"a": 20, "g": 5261, "ar": "أَمَّنْ هَٰذَا ٱلَّذِى هُوَ جُندٌۭ لَّكُمْ يَنصُرُكُم مِّن دُونِ ٱلرَّحْمَٰنِ ۚ إِنِ ٱلْكَٰفِرُونَ إِلَّا فِى غُرُورٍ", "uz": "Роҳмандан бошқа сизларга ёрдам берадиган аскар ким ўзи? Кофирлар ғурурдан бошқа ҳеч нарсада эмаслар!"}, {"a": 21, "g": 5262, "ar": "أَمَّنْ هَٰذَا ٱلَّذِى يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُۥ ۚ بَل لَّجُّوا۟ فِى عُتُوٍّۢ وَنُفُورٍ", "uz": "У Ризқни тортиб қўйса, сизга ризқ берадиган ким ўзи?! Балки улар абадий туғёнда ва ҳақдан нафратда бўлурлар."}, {"a": 22, "g": 5263, "ar": "أَفَمَن يَمْشِى مُكِبًّا عَلَىٰ وَجْهِهِۦٓ أَهْدَىٰٓ أَمَّن يَمْشِى سَوِيًّا عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "uz": "Юз тубан қоқилиб юраётган киши ҳидоятдами ёки тўғри йўлдан қоматини тик тутиб бораётган кишими? («Юз тубан, қоқилиб юраётган киши» кофир кишидир. Чунки, унинг аниқ йўли, мақсади ва кўрсатмаси йўқ. Йўли адаштирувчи, хавф-хатарларга тўладир.)"}, {"a": 23, "g": 5264, "ar": "قُلْ هُوَ ٱلَّذِىٓ أَنشَأَكُمْ وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَٰرَ وَٱلْأَفْـِٔدَةَ ۖ قَلِيلًۭا مَّا تَشْكُرُونَ", "uz": "Сен: «У сизларни йўқдан бор қилган ва сизларга эшитиш, кўриш ва ақлни берган зотдир. Жуда ҳам оз шукр қиласизлар-а?!» деб айт."}, {"a": 24, "g": 5265, "ar": "قُلْ هُوَ ٱلَّذِى ذَرَأَكُمْ فِى ٱلْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ", "uz": "Сен: «У сизларни ер юзида яратган, кўпайтирган зотдир. Ва Унинг ҳузурига тўпланурсизлар», деб айт."}, {"a": 25, "g": 5266, "ar": "وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَٰدِقِينَ", "uz": "Ва улар: «Агар ростгўй бўлсангиз, бу ваъда қачон бўлади?» дерлар."}, {"a": 26, "g": 5267, "ar": "قُلْ إِنَّمَا ٱلْعِلْمُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٌۭ مُّبِينٌۭ", "uz": "Мен: «Албатта, илм, фақат Аллоҳнинг ҳузуридадир. Ва албатта, мен яққол огоҳлантирувчиман, холос», деб айт."}, {"a": 27, "g": 5268, "ar": "فَلَمَّا رَأَوْهُ زُلْفَةًۭ سِيٓـَٔتْ وُجُوهُ ٱلَّذِينَ كَفَرُوا۟ وَقِيلَ هَٰذَا ٱلَّذِى كُنتُم بِهِۦ تَدَّعُونَ", "uz": "Бас азобни яқиндан кўрганда куфр келтирганларнинг юзлари қораяр. Ва уларга: «Сўраган нарсангиз шу бўлади», дейилур."}, {"a": 28, "g": 5269, "ar": "قُلْ أَرَءَيْتُمْ إِنْ أَهْلَكَنِىَ ٱللَّهُ وَمَن مَّعِىَ أَوْ رَحِمَنَا فَمَن يُجِيرُ ٱلْكَٰفِرِينَ مِنْ عَذَابٍ أَلِيمٍۢ", "uz": "Сен: «Айтинглар-чи, агар Аллоҳ мени ва мен билан бўлганларни ҳалок қилса ёки раҳм қилса, кофирларни аламли азобдан ким қутқариб қолади?!» деб айт."}, {"a": 29, "g": 5270, "ar": "قُلْ هُوَ ٱلرَّحْمَٰنُ ءَامَنَّا بِهِۦ وَعَلَيْهِ تَوَكَّلْنَا ۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِى ضَلَٰلٍۢ مُّبِينٍۢ", "uz": "Сен: «У Роҳмандур, биз Унга иймон келтирдик ва Унга таваккал қилдик. Бас, сизлар тезда ким очиқ-ойдин хатода эканини билурсизлар», деб айт."}, {"a": 30, "g": 5271, "ar": "قُلْ أَرَءَيْتُمْ إِنْ أَصْبَحَ مَآؤُكُمْ غَوْرًۭا فَمَن يَأْتِيكُم بِمَآءٍۢ مَّعِينٍۭ", "uz": "Сен: «Айтинглар-чи, агар сувларингиз ерга сингиб кетса, сизларга ким осонгина топиладиган сувни келтиради?» деб айт."}], "103": [{"a": 1, "g": 6177, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلْعَصْرِ", "uz": "Аср билан қасам."}, {"a": 2, "g": 6178, "ar": "إِنَّ ٱلْإِنسَٰنَ لَفِى خُسْرٍ", "uz": "Албатта, инсон хусрондадир. (Хусрон-мағлубият, ютқизиқ ва нуқсон маъноларини англатади.)"}, {"a": 3, "g": 6179, "ar": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَتَوَاصَوْا۟ بِٱلْحَقِّ وَتَوَاصَوْا۟ بِٱلصَّبْرِ", "uz": "Магар иймон келтирганлар ва солиҳ амаллар қилганлар, бир-бирларини ҳақга чақирганлар ва бир-бирларини сабрга чақирганлар мустаснодир. (Маълум бўлдики, инсон икки дунёда бадбахт бўлиб қолмаслик учун тўртта сифатга эга бўлиши керак экан: Аллоҳга иймон келтириши. Солиҳ амаллар қилиши. Ҳақ амаллар қилиши. Сабрга чақириши.)"}], "104": [{"a": 1, "g": 6180, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَيْلٌۭ لِّكُلِّ هُمَزَةٍۢ لُّمَزَةٍ", "uz": "Ҳар бир обрў тўкувчи ва айбловчига «вайл» бўлсин."}, {"a": 2, "g": 6181, "ar": "ٱلَّذِى جَمَعَ مَالًۭا وَعَدَّدَهُۥ", "uz": "У мол жамлади ва уни санаб турди."}, {"a": 3, "g": 6182, "ar": "يَحْسَبُ أَنَّ مَالَهُۥٓ أَخْلَدَهُۥ", "uz": "У, албатта, уни абадий қолдирур, деб ҳисоблар."}, {"a": 4, "g": 6183, "ar": "كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ", "uz": "Йўқ! Албатта у «ҳутома»га хор-зор этиб ташланар."}, {"a": 5, "g": 6184, "ar": "وَمَآ أَدْرَىٰكَ مَا ٱلْحُطَمَةُ", "uz": "«Ҳутома» қандоқ нарса эканини сенга нима билдирар?"}, {"a": 6, "g": 6185, "ar": "نَارُ ٱللَّهِ ٱلْمُوقَدَةُ", "uz": "У Аллоҳнинг шиддатли, ўчмас оловидир."}, {"a": 7, "g": 6186, "ar": "ٱلَّتِى تَطَّلِعُ عَلَى ٱلْأَفْـِٔدَةِ", "uz": "Қалбгача етиб борадир."}, {"a": 8, "g": 6187, "ar": "إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌۭ", "uz": "Албатта, у уларни устидан қоплангандир."}, {"a": 9, "g": 6188, "ar": "فِى عَمَدٍۢ مُّمَدَّدَةٍۭ", "uz": "Узун-узун устунларга боғлангандирлар."}], "105": [{"a": 1, "g": 6189, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ", "uz": "Роббинг фил соҳибларини қандоқ қилганини билмадингми?"}, {"a": 2, "g": 6190, "ar": "أَلَمْ يَجْعَلْ كَيْدَهُمْ فِى تَضْلِيلٍۢ", "uz": "Уларнинг макру ҳийласини зое кетказмадими?"}, {"a": 3, "g": 6191, "ar": "وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ", "uz": "Ва уларнинг устига тўп-тўп қушларни юбормадими?"}, {"a": 4, "g": 6192, "ar": "تَرْمِيهِم بِحِجَارَةٍۢ مِّن سِجِّيلٍۢ", "uz": "Лойдан пиширилган тошларни отадиганларни?"}, {"a": 5, "g": 6193, "ar": "فَجَعَلَهُمْ كَعَصْفٍۢ مَّأْكُولٍۭ", "uz": "Бас, уларни қурт еб ташлаган ўсимликка ўхшатиб юбормадими?. Муҳаммад алайҳиссалом «Фил йили»да туғилганлар дейилишининг сабаби ҳам шу."}], "106": [{"a": 1, "g": 6194, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ لِإِيلَٰفِ قُرَيْشٍ", "uz": "Қурайшнинг лозим тутиши қандай яхши!"}, {"a": 2, "g": 6195, "ar": "إِۦلَٰفِهِمْ رِحْلَةَ ٱلشِّتَآءِ وَٱلصَّيْفِ", "uz": "Уларнинг қиш ва ёз сафарларини ўзларига лозим тутишлари қандай яхши!"}, {"a": 3, "g": 6196, "ar": "فَلْيَعْبُدُوا۟ رَبَّ هَٰذَا ٱلْبَيْتِ", "uz": "Бас, улар мана шу Байтнинг Роббисига ибодат қилсинлар!"}, {"a": 4, "g": 6197, "ar": "ٱلَّذِىٓ أَطْعَمَهُم مِّن جُوعٍۢ وَءَامَنَهُم مِّنْ خَوْفٍۭ", "uz": "У зот уларини очликдан тўқ қилган, хавфдан омон қилгандир."}], "107": [{"a": 1, "g": 6198, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَرَءَيْتَ ٱلَّذِى يُكَذِّبُ بِٱلدِّينِ", "uz": "Жазо кунини ёлғонга чиқарувчини кўрдингми?"}, {"a": 2, "g": 6199, "ar": "فَذَٰلِكَ ٱلَّذِى يَدُعُّ ٱلْيَتِيمَ", "uz": "Ана ўша, етимни қўполлик билан ҳайдайдир."}, {"a": 3, "g": 6200, "ar": "وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ", "uz": "Ва мискинларга таом беришга қизиқтирмайдир."}, {"a": 4, "g": 6201, "ar": "فَوَيْلٌۭ لِّلْمُصَلِّينَ", "uz": "«Намозхонлар»га вайл бўлсин."}, {"a": 5, "g": 6202, "ar": "ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ", "uz": "Улар ўз намозларини унитувчилардир."}, {"a": 6, "g": 6203, "ar": "ٱلَّذِينَ هُمْ يُرَآءُونَ", "uz": "Ана ўшалар риё қиладиганлардир."}, {"a": 7, "g": 6204, "ar": "وَيَمْنَعُونَ ٱلْمَاعُونَ", "uz": "Ва маоъунни ман қиладиганлардир."}], "108": [{"a": 1, "g": 6205, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ إِنَّآ أَعْطَيْنَٰكَ ٱلْكَوْثَرَ", "uz": "Албатта, Биз сенга Кавсарни бердик."}, {"a": 2, "g": 6206, "ar": "فَصَلِّ لِرَبِّكَ وَٱنْحَرْ", "uz": "Бас, Роббингга намоз ўқи ва жонлик сўй."}, {"a": 3, "g": 6207, "ar": "إِن , "ar": "وَٱمْرَأَتُهُۥ حَمَّالَةَ ٱلْحَطَبِ", "uz": "Ва унинг хотини, ўтин кўтарган аёл ҳам."}, {"a": 5, "g": 6221, "ar": "فِى جِيدِهَا حَبْلٌۭ مِّن مَّسَدٍۭ", "uz": "У(аёл)нинг бўйнида эшилган арқон бор ҳолда."}], "112": [{"a": 1, "g": 6222, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ", "uz": "Айт: «У Аллоҳ ягонадир»."}, {"a": 2, "g": 6223, "ar": "ٱللَّهُ ٱلصَّمَدُ", "uz": "Аллоҳ сомаддир. (Ҳожатларни ва рағбатларни қондирувчидир.)"}, {"a": 3, "g": 6224, "ar": "لَمْ يَلِدْ وَلَمْ يُولَدْ", "uz": "У туғмаган ва туғилмаган."}, {"a": 4, "g": 6225, "ar": "وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ", "uz": "Ва Унга ҳеч ким тенг бўлмаган. (Аллоҳ таолога бирор зот на зотида, на сифатида ва на амалида тенг бўлган эмас, бўлолмайди ҳам.)"}], "113": [{"a": 1, "g": 6226, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ", "uz": "Тонг Роббисидан паноҳ сўрайман."}, {"a": 2, "g": 6227, "ar": "مِن شَرِّ مَا خَلَقَ", "uz": "У яратган нарсалар ёмонлигидан."}, {"a": 3, "g": 6228, "ar": "وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ", "uz": "Ва кириб келган қоронғулик ёмонлигидан."}, {"a": 4, "g": 6229, "ar": "وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ", "uz": "Ва тугунларга дам солувчилар ёмонлигидан. (Сеҳргарлар бировни сеҳрлаб зарар етказмоқчи бўлса, ип олиб, ўқийдиган нарсасини ўқиб, дам солиб, ипни бир тугиб, яна бир дам солиб, яна тугиб, охирига етказар экан.)"}, {"a": 5, "g": 6230, "ar": "وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", "uz": "Ва ҳасад қилган ҳасадчининг ёмонлигидан, деб айт."}], "114": [{"a": 1, "g": 6231, "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ", "uz": "Одамлар Роббисидан."}, {"a": 2, "g": 6232, "ar": "مَلِكِ ٱلنَّاسِ", "uz": "Одамлар Подшоҳидан."}, {"a": 3, "g": 6233, "ar": "إِلَٰهِ ٱلنَّاسِ", "uz": "Одамлар Илоҳидан паноҳ сўрайман."}, {"a": 4, "g": 6234, "ar": "مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ", "uz": "Беркиниб, кўриниб турувчи васвоснинг."}, {"a": 5, "g": 6235, "ar": "ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱ
